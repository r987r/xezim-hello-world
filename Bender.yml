package:
  name: xezim_soc_verification

# Standard Bender ordered source sets; revisions live in config/ip.lock.yaml.
# tools/regress.py fetches the requested pins before resolving a target.
# FlooNoC uses its own upstream Bender.yml + Bender.lock, without merging
# its AXI dependency with the separate, planned SoC PULP AXI revision.
sources:
  - target: any(memory, chip_boot)
    files:
      - .tools/verilog_axi/rtl/priority_encoder.v
      - .tools/verilog_axi/rtl/arbiter.v
      - .tools/verilog_axi/rtl/axi_crossbar_addr.v
      - .tools/verilog_axi/rtl/axi_register_wr.v
      - .tools/verilog_axi/rtl/axi_register_rd.v
      - .tools/verilog_axi/rtl/axi_crossbar_wr.v
      - .tools/verilog_axi/rtl/axi_crossbar_rd.v
      - .tools/verilog_axi/rtl/axi_crossbar.v
      - .tools/verilog_axi/rtl/axi_ram.v
  - target: memory
    files:
      - rtl/adapters/axi_memory_target_model.sv
      - dv/common/axi_master_bfm.sv
      - dv/common/axi_route_monitor.sv
      - gen/memory/memory_tb.sv
  - target: any(boot, cpu, chip_boot)
    files:
      - .tools/picorv32/picorv32.v
      - rtl/adapters/picorv32_cpu_adapter.sv
  - target: any(boot, cpu, serv, chip_boot)
    files:
      - .tools/serv/rtl/serv_bufreg.v
      - .tools/serv/rtl/serv_bufreg2.v
      - .tools/serv/rtl/serv_alu.v
      - .tools/serv/rtl/serv_csr.v
      - .tools/serv/rtl/serv_ctrl.v
      - .tools/serv/rtl/serv_decode.v
      - .tools/serv/rtl/serv_immdec.v
      - .tools/serv/rtl/serv_mem_if.v
      - .tools/serv/rtl/serv_rf_if.v
      - .tools/serv/rtl/serv_rf_ram_if.v
      - .tools/serv/rtl/serv_rf_ram.v
      - .tools/serv/rtl/serv_state.v
      - .tools/serv/rtl/serv_debug.v
      - .tools/serv/rtl/serv_top.v
      - .tools/serv/rtl/serv_rf_top.v
      - .tools/serv/rtl/serv_aligner.v
      - .tools/serv/rtl/serv_compdec.v
      - rtl/adapters/serv_cpu_adapter.sv
  - target: any(boot, sram)
    files:
      - rtl/memory/local_sram.sv
  - target: boot
    files:
      - rtl/interconnect/boot_local_decode.sv
      - rtl/boot/boot_memory_model.sv
      - gen/boot/boot_config_pkg.sv
      - dv/boot/boot_tb.sv
  - target: serv
    files: [dv/cpu/serv_minimal_tb.sv]
  - target: sram
    files: [dv/memory/local_sram_tb.sv]
  - target: cpu
    files: [dv/cpu/heterogeneous_cpu_tb.sv]
  - target: smoke
    files: [dv/smoke/hello_world_tb.sv]
  - target: any(supernoc, chip_boot)
    files: [gen/supernoc/soc_noc.sv]
  - target: supernoc
    files: [gen/supernoc/supernoc_tb.sv]
  - target: chip_boot
    files:
      - .tools/wb2axip/rtl/wbm2axilite.v
      - rtl/adapters/chip_types_pkg.sv
      - rtl/adapters/serv_axi_lite_adapter.sv
      - rtl/adapters/cpu_noc_adapter.sv
      - rtl/adapters/axi_sram_target.sv
      - gen/chip/soc_top.sv
      - gen/chip/full_chip_tb.sv

  # One substantive real DMA-only scope, preserving boot and NoC source sets.
  # All implementation modules are sourced at config/ip.lock.yaml's PULP pin;
  # the generated backend/register RTL is produced by tools/idma_rtl.py.
  - target: dma
    files:
      - .tools/pulp_idma/src/idma_pkg.sv
      - .tools/pulp_idma/src/idma_float_pkg.sv
      - .tools/pulp_idma/src/backend/idma_axi_read.sv
      - .tools/pulp_idma/src/backend/idma_axi_write.sv
      - .tools/pulp_idma/src/backend/idma_channel_coupler.sv
      - .tools/pulp_idma/src/backend/idma_dataflow_element.sv
      - .tools/pulp_idma/src/backend/idma_error_handler.sv
      - .tools/pulp_idma/src/backend/idma_legalizer_page_splitter.sv
      - .tools/pulp_idma/src/backend/idma_legalizer_pow2_splitter.sv
      - .tools/pulp_idma/src/backend/idma_otf_transpose.sv
      - .tools/pulp_idma/src/backend/idma_otf_mxquant.sv
      - .tools/pulp_idma/src/backend/idma_otf_mxdequant.sv
      - .tools/pulp_idma/src/backend/idma_otf_compute.sv
      - .tools/pulp_idma/target/rtl/idma_transport_layer_rw_axi.sv
      - .tools/pulp_idma/target/rtl/idma_legalizer_rw_axi.sv
      - .tools/pulp_idma/target/rtl/idma_backend_rw_axi.sv
      - .tools/pulp_idma/target/rtl/idma_desc64_reg_pkg.sv
      - .tools/pulp_idma/target/rtl/idma_desc64_addrmap_pkg.sv
      - .tools/pulp_idma/target/rtl/idma_desc64_reg_top.sv
      - .tools/pulp_idma/src/frontend/desc64/idma_desc64_ar_gen.sv
      - .tools/pulp_idma/src/frontend/desc64/idma_desc64_ar_gen_prefetch.sv
      - .tools/pulp_idma/src/frontend/desc64/idma_desc64_reader.sv
      - .tools/pulp_idma/src/frontend/desc64/idma_desc64_reader_gater.sv
      - .tools/pulp_idma/src/frontend/desc64/idma_desc64_reshaper.sv
      - .tools/pulp_idma/src/frontend/desc64/idma_desc64_reg_wrapper.sv
      - .tools/pulp_idma/src/frontend/desc64/idma_desc64_top.sv
      - rtl/adapters/soc_dma_regs.sv
      - rtl/adapters/soc_idma_engine.sv
      - dv/dma/dma_tb.sv
  - target: chip_dma
    files: [gen/chip/full_chip_dma_tb.sv]
