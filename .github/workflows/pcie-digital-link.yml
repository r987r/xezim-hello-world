name: PCIe digital link - pinned endpoint/host provider qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/ip.lock.yaml'
      - 'config/pcie_link.yaml'
      - 'tools/ip_fetch.py'
      - 'tools/pcie_link.py'
      - 'tools/ci_require_cocotb.py'
      - 'tools/generate.py'
      - 'dv/pcie_link/**'
      - 'gen/pcie_link/**'
      - 'gen/manifest.json'
      - 'tests/test_pcie_link.py'
      - 'tests/test_pcie_scenario.py'
      - 'dv/common/scenario.py'
      - 'dv/common/action_runtime.py'
      - 'config/scenarios/pcie-gen1-link.json'
      - 'tests/test_ci_require_cocotb.py'
      - 'tests/test_ip_fetch_submodules.py'
      - '.github/workflows/pcie-digital-link.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: pcie-digital-link-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-contract:
    name: Pinned source selection and real adapter unit behavior (NOT L0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install only source-preflight dependencies
        run: |
          set -euo pipefail
          python3 -m pip install 'PyYAML==6.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
      - name: Prove profile swaps fail closed and checked-in generated selection agrees
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_pcie_link tests.test_ip_fetch_submodules tests.test_ci_require_cocotb tests.test_pcie_scenario -v
          python3 tools/pcie_link.py --check
          mkdir -p .tools/pcie-link
          iverilog -g2012 -s tb_pcie_pipe_x1_adapter \
            -o .tools/pcie-link/pipe_x1_adapter.vvp \
            dv/pcie_link/pipe_x1_adapter.sv dv/pcie_link/tb_pipe_x1_adapter.sv
          vvp .tools/pcie-link/pipe_x1_adapter.vvp \
            | tee .tools/pcie-link/adapter-unit.log
          grep -q '^PASS: Gen1 x1' .tools/pcie-link/adapter-unit.log
          # An actual request-driven PHY response, not a timer-generated LinkUp.
          iverilog -g2012 -s tb_pcie_phy_status_responder \
            -o .tools/pcie-link/phy_status.vvp \
            dv/pcie_link/phy_status_responder.sv \
            dv/pcie_link/tb_phy_status_responder.sv
          vvp .tools/pcie-link/phy_status.vvp \
            | tee .tools/pcie-link/phy-status-unit.log
          grep -q '^PASS: Gen1 receiver-detect' .tools/pcie-link/phy-status-unit.log
      - name: Fetch three independently pinned providers and check original port names
        run: |
          set -euo pipefail
          python3 tools/ip_fetch.py pcie_endpoint_openpcie pcie_host_pcievhost pcie_host_vproc
          python3 tools/pcie_link.py --check --check-upstream
          cp gen/pcie_link/selection.json .tools/pcie-link/selection.json
          git -C .tools/pcie_endpoint_openpcie rev-parse HEAD \
            > .tools/pcie-link/endpoint-head.txt
          git -C .tools/pcie_host_pcievhost rev-parse HEAD \
            > .tools/pcie-link/host-head.txt
          git -C .tools/pcie_host_vproc rev-parse HEAD \
            > .tools/pcie-link/vproc-head.txt
      - name: Retain original selection, adapter smoke and pinned version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcie-digital-provider-contract-${{ github.run_id }}
          path: |
            gen/pcie_link/
            .tools/pcie-link/
          include-hidden-files: true
          if-no-files-found: warn

  generated-tree-parity:
    name: Existing make check-generated with new checked-in PCIe manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bender
        env: {GH_TOKEN: "${{ github.token }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build original generator dependencies, do not bypass SoC drift gates
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
          python3 tools/generate.py --check

  upstream-endpoint:
    name: Pinned OpenPCIe FuseSoC/Verilator + reviewed LTSSM fix (NOT yet host-connected)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned RTL toolchain and original upstream test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator
          python3 -m pip install 'PyYAML==6.0.2' 'fusesoc==2.4.4' \
            'edalize==0.6.1' 'cocotb==1.9.2' 'pyuvm==3.0.0' \
            'cocotb-bus==0.2.1' 'cocotb-coverage==1.2.0' \
            'cocotbext-pcie==0.2.16' 'cocotbext-axi==0.1.26' \
            'cocotb-test==0.2.5' 'crc==7.1.0' \
            'bitstring==4.3.1' 'bitarray==3.7.2' \
            'pyvsc==0.9.5.27214109393'
          python3 tools/ip_fetch.py pcie_endpoint_openpcie pcie_host_pcievhost pcie_host_vproc
      - name: Apply only source-pinned, reviewed LTSSM fix and run original verification target
        run: |
          set -euo pipefail
          mkdir -p .tools/pcie-link
          python3 tools/pcie_link.py --check --check-upstream --apply-selected-overlays
          git -C .tools/pcie_endpoint_openpcie diff -- src/ltssm/pcie_ltssm_downstream.sv \
            > .tools/pcie-link/openpcie-reviewed-ltssm.diff
          test -s .tools/pcie-link/openpcie-reviewed-ltssm.diff
          fusesoc --cores-root=.tools/pcie_endpoint_openpcie \
            run --target=sim fusesoc:pcie:phy_core:1.0.0 \
            2>&1 | tee .tools/pcie-link/openpcie-upstream.log
          # FuseSoC can exit zero even when Cocotb fails test-module import.
          # Require an actual completed, nonempty and entirely passing test table.
          python3 tools/ci_require_cocotb.py .tools/pcie-link/openpcie-upstream.log
      - name: Preserve upstream endpoint run evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpcie-upstream-rtl-${{ github.run_id }}
          path: |
            gen/pcie_link/
            .tools/pcie-link/
          include-hidden-files: true
          if-no-files-found: warn

  upstream-host:
    name: Original pcievhost x1 model smoke (NOT connected to OpenPCIe)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch testbench-only GPL host and pinned VProc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator build-essential
          python3 -m pip install 'PyYAML==6.0.2'
          python3 tools/ip_fetch.py pcie_host_pcievhost pcie_host_vproc
      - name: Build/run upstream x1 self-test with pinned host backend
        run: |
          set -euo pipefail
          mkdir -p .tools/pcie-link
          # Upstream files.verilator hardcodes ../../../vproc/f_VProc.v;
          # makefile VPROC_TOP alone cannot override this ORIGINAL filelist.
          # Alias the verified exact-pinned tree (no source copy or fork).
          test ! -e .tools/vproc
          ln -s pcie_host_vproc .tools/vproc
          test "$(git -C .tools/vproc rev-parse HEAD)" = \
            "ae80e5b5cb43d4e9f82f9d45aa3b614e053f9df4"
          make -C .tools/pcie_host_pcievhost/verilog/testpipex1 \
            -f makefile.verilator run VPROC_TOP=../../../vproc \
            2>&1 | tee .tools/pcie-link/pcievhost-upstream.log
      - name: Retain original upstream host build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcievhost-upstream-bfm-${{ github.run_id }}
          path: |
            gen/pcie_link/
            .tools/pcie-link/
          include-hidden-files: true
          if-no-files-found: warn

  cross-provider-elaboration:
    name: Cross-connected real OpenPCIe RTL and independent pcievhost (elaboration ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch pinned endpoint/host/VProc and original FuseSoC RTL dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator
          python3 -m pip install 'PyYAML==6.0.2' 'fusesoc==2.4.4' 'edalize==0.6.1'
          python3 tools/ip_fetch.py pcie_endpoint_openpcie pcie_host_pcievhost pcie_host_vproc
          python3 tools/pcie_link.py --check --check-upstream --apply-selected-overlays
          fusesoc --cores-root=.tools/pcie_endpoint_openpcie \
            run --setup --target=sim fusesoc:pcie:phy_core:1.0.0
      - name: Compile actual selected RC + endpoint source at shared Gen1 PIPE boundary
        run: |
          set -euo pipefail
          # Original FuseSoC resolves the complete transitive endpoint RTL.
          # No synthesized symbol-stream or LTSSM stand-in is used.
          # The original host generates its Verilog register-map header from C.
          make -C .tools/pcie_host_pcievhost/verilog/testpipex1 \
            -f makefile.verilator ../headers/pcie_vhost_map.v
          cd build/fusesoc_pcie_phy_core_1.0.0/sim
          root="$GITHUB_WORKSPACE"
          rc="$root/.tools/pcie_host_pcievhost"
          vproc="$root/.tools/pcie_host_vproc"
          verilator --lint-only --timing -Wno-fatal -DVPROC_SV \
            -I"$rc/verilog/headers" -I"$rc/verilog/testpipex1" -I"$vproc" \
            -f fusesoc_pcie_phy_core_1.0.0.vc \
            "$rc/verilog/lib/Serialiser.v" \
            "$rc/verilog/lib/clkmux.v" \
            "$rc/verilog/pcieVHost/pcieVHostPipex1.v" \
            "$rc/verilog/pcieVHost/pcieVHost.v" \
            "$vproc/f_VProc.v" \
            "$root/dv/pcie_link/pipe_x1_adapter.sv" \
            "$root/dv/pcie_link/phy_status_responder.sv" \
            "$root/dv/pcie_link/tb_pcie_cross_link.sv" \
            --top-module test \
            2>&1 | tee "$root/cross-provider-elaboration.log"
          # RTL elaboration is only a necessary precondition, never L0 proof.
      - name: Archive original compiler output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcie-cross-provider-elaboration-${{ github.run_id }}
          path: cross-provider-elaboration.log
          if-no-files-found: warn

  cross-provider-training:
    name: Independent real RC InitLink(1) to OpenPCIe endpoint L0 (NO forced link-up)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch and prepare original pinned endpoint plus GPL simulation host
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator build-essential
          python3 -m pip install 'PyYAML==6.0.2' 'fusesoc==2.4.4' 'edalize==0.6.1'
          python3 tools/ip_fetch.py pcie_endpoint_openpcie pcie_host_pcievhost pcie_host_vproc
          python3 tools/pcie_link.py --check --check-upstream --apply-selected-overlays
          fusesoc --cores-root=.tools/pcie_endpoint_openpcie \
            run --setup --target=sim fusesoc:pcie:phy_core:1.0.0
          # The upstream host makefile requires this exact pinned VProc alias.
          test ! -e .tools/vproc
          ln -s pcie_host_vproc .tools/vproc
          test "$(git -C .tools/vproc rev-parse HEAD)" = \
            "ae80e5b5cb43d4e9f82f9d45aa3b614e053f9df4"
          host=.tools/pcie_host_pcievhost/verilog
          cp -a "$host/testpipex1" "$host/testcross_x1"
          cp dv/pcie_link/tb_pcie_cross_link.sv "$host/testcross_x1/test.v"
          cp dv/pcie_link/host_link_vproc.cpp \
            "$host/testcross_x1/usercode/VUserMain0.cpp"
          # Exactly one canonical SCN scenario/plan, shared with Python/C/SV.
          mkdir -p .tools/pcie-link/scenario
          python3 tools/scenario_plan.py \
            --scenario config/scenarios/pcie-gen1-link.json \
            --soc config/soc.yaml \
            --out .tools/pcie-link/scenario/scenario-plan.json \
            --source-revision "$GITHUB_SHA"
          python3 tools/scenario_c.py \
            --plan .tools/pcie-link/scenario/scenario-plan.json \
            --out "$host/testcross_x1/usercode/soc_scenario_contract.h"
          cp sw/common/soc_scn_action_adapter.h \
            "$host/testcross_x1/usercode/soc_scn_action_adapter.h"
          make -C "$host/testcross_x1" -f makefile.verilator \
            ../headers/pcie_vhost_map.v
          # Builds original host library and only the test-owned VProc node 0.
          make -C "$host/testcross_x1" -f makefile.verilator \
            vproc_lib NUM_VPROC=1 USER_C=VUserMain0.cpp \
            VPROC_TOP=../../../vproc
      - name: Compile and execute cross-connected real host/endpoint LTSSMs
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          host="$root/.tools/pcie_host_pcievhost/verilog"
          vproc="$root/.tools/pcie_host_vproc"
          sim="$root/build/fusesoc_pcie_phy_core_1.0.0/sim"
          cd "$sim"
          verilator --binary -sv --timing -Wno-fatal -DVPROC_SV \
            -I"$host/headers" -I"$host/testcross_x1" -I"$vproc" \
            -f fusesoc_pcie_phy_core_1.0.0.vc \
            "$host/lib/Serialiser.v" "$host/lib/clkmux.v" \
            "$host/pcieVHost/pcieVHostPipex1.v" \
            "$host/pcieVHost/pcieVHost.v" "$vproc/f_VProc.v" \
            "$root/dv/pcie_link/pipe_x1_adapter.sv" \
            "$root/dv/pcie_link/phy_status_responder.sv" \
            "$root/dv/pcie_link/tb_pcie_cross_link.sv" \
            --top-module test -Mdir "$root/.tools/pcie-cross-obj" \
            -CFLAGS '-std=c++17 -Wno-attributes' \
            -LDFLAGS "-Wl,-E -lrt -rdynamic -Wl,-whole-archive \
              -L$host/testcross_x1 -lvproc \
              -L$root/.tools/pcie_host_pcievhost/lib -lpcievhost \
              -Wl,-no-whole-archive -ldl" \
            2>&1 | tee "$root/pcie-cross-build.log"
          # The selected plan SHA is independently computed by the runner,
          # not copied from the same generated C header.
          export SOC_SELECTED_PLAN_SHA
          SOC_SELECTED_PLAN_SHA="$(sha256sum "$root/.tools/pcie-link/scenario/scenario-plan.json" | cut -d' ' -f1)"
          "$root/.tools/pcie-cross-obj/Vtop" 2>&1 | tee "$root/pcie-cross-run.log"
          grep -Fq "PCIE_SCN_DRIVER: plan=$SOC_SELECTED_PLAN_SHA action=train_link stage=issued" "$root/pcie-cross-run.log"
          grep -Fq "PCIE_SCN_DRIVER: plan=$SOC_SELECTED_PLAN_SHA action=train_link stage=driver_done" "$root/pcie-cross-run.log"
          # Require independently observed actual LTSSMs, not just $finish.
          grep -q '^PCIE_HOST_L0:' "$root/pcie-cross-run.log"
          grep -q '^PCIE_ENDPOINT_L0:' "$root/pcie-cross-run.log"
          grep -q '^PCIE_TRACE: receiver-detect request' "$root/pcie-cross-run.log"
          grep -q '^PCIE_TRACE: PHY receiver present' "$root/pcie-cross-run.log"
      - name: Retain original commands, build and independent training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcie-cross-provider-training-${{ github.run_id }}
          path: |
            pcie-cross-build.log
            pcie-cross-run.log
            .tools/pcie-link/scenario/scenario-plan.json
          if-no-files-found: warn
