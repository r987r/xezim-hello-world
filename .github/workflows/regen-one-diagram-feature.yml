name: Regenerate canonical single NoC diagram on feature branch
on:
  push:
    branches: [feat/one-noc-diagram-supernoc-dv-20261103]
    paths:
      - 'tools/noc_diagrams.py'
      - 'tools/diagram_gen.py'
      - 'tools/generate.py'
      - 'tools/supernoc_gen.py'
      - 'tests/**'
      - '.github/workflows/regen-one-diagram-feature.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked FlooGen
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Regenerate, validate and preserve NoC sources
        run: |
          set -euo pipefail
          make gen
          make check-generated
          make check-config
          python3 - <<'PY'
          from pathlib import Path
          p=Path("gen/diagrams")
          imgs=sorted(str(x) for x in p.rglob("*.svg"))
          assert imgs==["gen/diagrams/noc-hierarchy.svg"],imgs
          assert len(list(Path("gen/noc/floonoc").rglob("*_noc.sv")))==8
          print("PASS: one diagram, eight real generated FlooNoC networks")
          PY
      - name: Commit generated tree and README
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A gen README.md
          if ! git diff --cached --quiet; then
            git commit -m "Keep single canonical SoC NoC diagram and remove obsolete diagram outputs"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
