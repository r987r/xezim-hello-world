name: Regenerate diagrams for FlooNoC feature branch
on:
  push:
    branches: [feat/dual-floonoc-global-networks-20261102]
    paths:
      - 'config/soc.yaml'
      - 'config/interface_contracts.yaml'
      - 'docs/subsystem-verification.md'
      - '.github/workflows/regen-floo-feature.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Regenerate all diagrams, metadata and marked README from config
        run: |
          set -euo pipefail
          make gen
          make check-generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gen README.md
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate SoC diagrams for unified FlooNoC topology"
            git push
          fi
