name: Publish pinned Xezim Linux executable

on:
  push:
    branches: [main]
    paths:
      - toolchains/xezim.env
      - .github/workflows/publish-xezim.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xezim-binary-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load pinned Xezim version and release names
        shell: bash
        run: |
          set -euo pipefail
          source toolchains/xezim.env
          for name in XEZIM_VERSION XEZIM_UPSTREAM_COMMIT XEZIM_RELEASE_TAG XEZIM_ASSET_NAME; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Skip building when release assets already exist
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$XEZIM_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if printf '%s\n' "$assets" | grep -Fxq "$XEZIM_ASSET_NAME" &&
             printf '%s\n' "$assets" | grep -Fxq "$XEZIM_ASSET_NAME.sha256"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Published simulator already exists; skipping Rust build.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore previously built simulator
        id: cache
        if: steps.released.outputs.exists != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tools/xezim/target/release/xezim
          key: xezim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/xezim.env') }}-lowmem

      - name: Install Rust on binary cache miss
        if: steps.released.outputs.exists != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned simulator on binary cache miss
        if: steps.released.outputs.exists != 'true' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$XEZIM_VERSION" https://github.com/aionhw/xezim.git .tools/xezim
          test "$(git -C .tools/xezim rev-parse HEAD)" = "$XEZIM_UPSTREAM_COMMIT"
          CARGO_BUILD_JOBS=1 \
          CARGO_PROFILE_RELEASE_LTO=false \
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
          CARGO_PROFILE_RELEASE_OPT_LEVEL=1 \
          CARGO_PROFILE_RELEASE_DEBUG=0 \
            cargo build --release --bin xezim --manifest-path .tools/xezim/Cargo.toml

      - name: Smoke-test simulator before publishing
        if: steps.released.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary=.tools/xezim/target/release/xezim
          test -x "$binary"
          "$binary" -s hello_world_tb dv/smoke/hello_world_tb.sv | tee "$RUNNER_TEMP/xezim-test.log"
          grep -Fxq "=== xezim $XEZIM_VERSION ===" "$RUNNER_TEMP/xezim-test.log"
          grep -Fxq 'PASS: hello_world_tb' "$RUNNER_TEMP/xezim-test.log"

      - name: Cache simulator for future publishing attempts
        if: steps.released.outputs.exists != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/xezim/target/release/xezim
          key: xezim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/xezim.env') }}-lowmem

      - name: Publish executable and checksum
        if: steps.released.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xezim-release"
          cp .tools/xezim/target/release/xezim "$RUNNER_TEMP/xezim-release/$XEZIM_ASSET_NAME"
          chmod 755 "$RUNNER_TEMP/xezim-release/$XEZIM_ASSET_NAME"
          cd "$RUNNER_TEMP/xezim-release"
          sha256sum "$XEZIM_ASSET_NAME" > "$XEZIM_ASSET_NAME.sha256"
          default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          gh release create "$XEZIM_RELEASE_TAG" "$XEZIM_ASSET_NAME" "$XEZIM_ASSET_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$default_branch" \
            --title "Xezim $XEZIM_VERSION Linux x86_64" \
            --notes "Pinned Xezim executable built from upstream commit $XEZIM_UPSTREAM_COMMIT. Check the accompanying SHA-256 checksum before running." \
            --latest=false

      - name: Verify published binary and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xezim-download-check"
          gh release download "$XEZIM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$XEZIM_ASSET_NAME" \
            --pattern "$XEZIM_ASSET_NAME.sha256" \
            --dir "$RUNNER_TEMP/xezim-download-check"
          (cd "$RUNNER_TEMP/xezim-download-check" && sha256sum -c "$XEZIM_ASSET_NAME.sha256")
