name: Ethernet TX real AXI DMA and SRAM packet stream
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/ethernet_tx_dma.v'
      - 'dv/ethernet0/tx_dma_tb.v'
      - 'tools/ethernet_unit_workspace.py'
      - 'tools/ethernet_frame_workspace.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'tests/test_ethernet_unit_workspace.py'
      - 'config/ip.lock.yaml'
      - 'tools/ip_fetch.py'
      - '.github/workflows/ethernet-tx-dma.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ethernet-tx-dma
  cancel-in-progress: true
jobs:
  tx-dma:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
      - name: Fetch exact pinned verilog-axi RTL modules
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 tools/ip_fetch.py verilog_axi
      - name: Check archive source and transcript custody
        run: python3 -m unittest tests.test_ethernet_unit_workspace -v
      - name: Compile and run real RTL AXI SRAM TX stream test
        id: native-unit
        run: python3 tools/ethernet_unit_workspace.py tx-dma
      - name: Archive original isolated RTL unit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-tx-dma-native-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-unit.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Archive failed RTL unit diagnostics separately
        if: failure() && steps.native-unit.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-tx-dma-diagnostics-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-unit.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: warn
