name: Ethernet TX real AXI DMA and SRAM packet stream
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/ethernet_tx_dma.v'
      - 'dv/ethernet0/tx_dma_tb.v'
      - '.github/workflows/ethernet-tx-dma.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ethernet-tx-dma
  cancel-in-progress: true
jobs:
  tx-dma:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
      - name: Fetch exact pinned verilog-axi RTL modules
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 tools/ip_fetch.py verilog_axi
      - name: Compile and run real RTL AXI SRAM TX stream test
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s ethernet_tx_dma_tb -o /tmp/eth_tx_dma_tb \
            rtl/io/ethernet0/ethernet_tx_dma.v \
            dv/ethernet0/tx_dma_tb.v \
            .tools/verilog_axi/rtl/axi_dma_rd.v \
            .tools/verilog_axi/rtl/axi_ram.v
          vvp /tmp/eth_tx_dma_tb
