name: Xezim Hello World smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out testbench repo
        uses: actions/checkout@v4
      - name: Restore cached Xezim executable
        id: cached-xezim
        uses: actions/cache@v4
        with:
          path: .tools/xezim/target/release/xezim
          key: xezim-0.11.3-ubuntu-x64-lowmem-v1
      - name: Install Rust (cache miss only)
        if: steps.cached-xezim.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Build Xezim on cache miss, then run testbench
        run: make test
