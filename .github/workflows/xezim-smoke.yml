name: Xezim Hello World smoke test

on:
  push:
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'scripts/run.sh'
      - 'Makefile'
  pull_request:
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'scripts/run.sh'
      - 'Makefile'
      - 'toolchains/xezim.env'
      - '.github/workflows/xezim-smoke.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish pinned Xezim Linux executable]
    types: [completed]

permissions:
  contents: read

jobs:
  compile-and-simulate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out testbench
        uses: actions/checkout@v4

      - name: Load pinned simulator release
        shell: bash
        run: |
          set -euo pipefail
          source toolchains/xezim.env
          for name in XEZIM_RELEASE_TAG XEZIM_ASSET_NAME; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Download and verify simulator binary (no Rust build)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/bin
          gh release download "$XEZIM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$XEZIM_ASSET_NAME" \
            --pattern "$XEZIM_ASSET_NAME.sha256" \
            --dir .tools/bin
          (cd .tools/bin && sha256sum -c "$XEZIM_ASSET_NAME.sha256")
          chmod +x ".tools/bin/$XEZIM_ASSET_NAME"

      - name: Compile, elaborate and simulate SystemVerilog
        shell: bash
        run: |
          XEZIM_BIN="$GITHUB_WORKSPACE/.tools/bin/$XEZIM_ASSET_NAME" make test
