name: Xezim Hello World smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out testbench repo
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Xezim and run testbench
        run: make test
