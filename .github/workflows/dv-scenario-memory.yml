name: DV scenario memory lifetime evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/scenario_memory_trace.py'
      - 'tests/test_scenario_memory_trace.py'
      - 'docs/scenario-memory-lifetimes.md'
      - '.github/workflows/dv-scenario-memory.yml'
      - 'dv/common/action_events.py'
      - 'dv/common/scenario.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dv-memory-lifetime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scenario configuration parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: 'Validate memory proof: plan, CPU, BFM, passive AXI, and existing evidence'
        run: python3 -m unittest tests.test_scenario_memory_trace tests.test_action_events tests.test_memory_plan tests.test_memory_report -v
