name: PCIe original host to real SRAM readback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pcie-connected-memory.yml'
      - '.github/actions/setup-bender/**'
      - 'config/ip.lock.yaml'
      - 'config/pcie_link.yaml'
      - 'config/regression.yaml'
      - 'config/soc.yaml'
      - 'Bender.yml'
      - 'Bender.lock'
      - 'config/scenarios/pcie-gen1-mem-ingress.json'
      - 'dv/pcie_link/**'
      - 'dv/pcie0/**'
      - 'tools/pcie_connected_compile.py'
      - 'tools/pcie_connected_roundtrip_evidence.py'
      - 'tests/test_pcie_connected_roundtrip_evidence.py'
      - 'tests/test_pcie_connected_workspace.py'
      - 'tools/pcie_bar0_evidence.py'
      - 'tools/pcie_cfg_overlay.py'
      - 'tools/pcie_link.py'
      - 'tools/ip_fetch.py'
      - 'tools/scenario_plan.py'
      - 'tools/scenario_c.py'
      - 'tools/regress.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'sw/common/soc_scn_action_adapter.h'
      - 'rtl/adapters/axi_sram_target.sv'
      - 'gen/noc/floonoc/**'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: pcie-real-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  connected-host-to-sram:
    name: Original Gen1 RC/EP, real bridge, generated NoC, SRAM and host CplD byte oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONNECTED_SIM: .tools/pcie-connected-fusesoc/fusesoc_pcie_phy_core_1.0.0/sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-10'
          github-token: ${{ github.token }}
      - uses: ./.github/actions/setup-bender
      - name: Toolchain and evidence parser negative checks
        run: |
          set -euo pipefail
          verilator --version
          python3 -m pip install 'PyYAML==6.0.2' 'fusesoc==2.4.4' 'edalize==0.6.1'
          python3 -m unittest tests.test_pcie_connected_roundtrip_evidence tests.test_pcie_connected_workspace -v
      - name: Fetch pinned original RC/EP, upstream PCIe bridge and real FlooNoC
        run: |
          set -euo pipefail
          python3 tools/ip_fetch.py pcie_endpoint_openpcie pcie_host_pcievhost pcie_host_vproc floonoc
          python3 tools/pcie_link.py --check --check-upstream --apply-selected-overlays
          python3 tools/pcie_cfg_overlay.py --checkout .tools/pcie_endpoint_openpcie
          fusesoc --cores-root=.tools/pcie_endpoint_openpcie run --setup --target=sim --build-root=.tools/pcie-connected-fusesoc fusesoc:pcie:phy_core:1.0.0
          python3 - <<'PY'
          import json, pathlib, subprocess
          lock=json.loads(pathlib.Path('dv/pcie0/upstream.lock.json').read_text())
          url,sha=lock['git'],lock['commit']
          assert url == 'https://github.com/alexforencich/verilog-pcie.git'
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          subprocess.run(['git','clone','--quiet','--no-checkout',url,'.tools/verilog_pcie'],check=True)
          subprocess.run(['git','-C','.tools/verilog_pcie','checkout','--quiet','--detach',sha],check=True)
          assert subprocess.check_output(['git','-C','.tools/verilog_pcie','rev-parse','HEAD'],text=True).strip()==sha
          PY
      - name: Reserve the exact connected host-to-SRAM workspace
        id: selected
        run: python3 tools/pcie_connected_compile.py --sim-dir "$CONNECTED_SIM"
      - name: Build the original independent pcievhost VProc with canonical SCN-C actions
        env:
          RUN_DIR: ${{ steps.selected.outputs.workspace }}
        run: |
          set -euo pipefail
          test -d "$RUN_DIR"
          test ! -e .tools/vproc
          ln -s pcie_host_vproc .tools/vproc
          host=.tools/pcie_host_pcievhost/verilog
          cp -a "$host/testpipex1" "$host/testcross_x1"
          cp dv/pcie_link/tb_pcie_cross_link.sv "$host/testcross_x1/test.v"
          cp dv/pcie_link/host_link_vproc.cpp "$host/testcross_x1/usercode/VUserMain0.cpp"
          python3 tools/scenario_plan.py \
            --scenario config/scenarios/pcie-gen1-mem-ingress.json \
            --soc config/soc.yaml \
            --out "$RUN_DIR/scenario-plan.json" \
            --source-revision "$GITHUB_SHA"
          python3 tools/scenario_c.py \
            --plan "$RUN_DIR/scenario-plan.json" \
            --out "$host/testcross_x1/usercode/soc_scenario_contract.h"
          cp sw/common/soc_scn_action_adapter.h "$host/testcross_x1/usercode/soc_scn_action_adapter.h"
          make -C "$host/testcross_x1" -f makefile.verilator ../headers/pcie_vhost_map.v
          make -C "$host/testcross_x1" -f makefile.verilator \
            vproc_lib NUM_VPROC=1 USER_C=VUserMain0.cpp VPROC_TOP=../../../vproc
      - name: Compile original endpoint and RC with actual bridge, selected FlooNoC and SRAM
        env:
          RUN_DIR: ${{ steps.selected.outputs.workspace }}
        run: |
          set -euo pipefail
          python3 tools/pcie_connected_compile.py --sim-dir "$CONNECTED_SIM" --workspace "$RUN_DIR" \
            2>&1 | tee "$RUN_DIR/build.log"
          test -s ".tools/pcie-connected-obj/${RUN_DIR##*/}/Vtop"
      - name: Require original host BAR memory readback and independent SRAM evidence
        env:
          RUN_DIR: ${{ steps.selected.outputs.workspace }}
        run: |
          set -euo pipefail
          export PCIE_HOST_SCRAMBLING=1
          export PCIE_HOST_MEMORY_READBACK=1
          export SOC_SELECTED_PLAN_SHA
          SOC_SELECTED_PLAN_SHA="$(sha256sum "$RUN_DIR/scenario-plan.json" | cut -d' ' -f1)"
          ".tools/pcie-connected-obj/${RUN_DIR##*/}/Vtop" 2>&1 | tee "$RUN_DIR/simulation.log"
          grep -Fq "PCIE_SCN_DRIVER: plan=$SOC_SELECTED_PLAN_SHA action=write_bar0 stage=driver_done" "$RUN_DIR/simulation.log"
          grep -Fq 'PCIE_RC_BAR_MRD_CPLD_PASS: addr=80001100 data=a5c36e91 same_real_host=1' "$RUN_DIR/simulation.log"
          python3 tools/pcie_connected_roundtrip_evidence.py "$RUN_DIR/simulation.log" \
            --out "$RUN_DIR"
          test -s "$RUN_DIR/pcie-connected-memory-evidence.json"
          python3 - <<'PY'
          import json, os, pathlib
          run=pathlib.Path(os.environ['RUN_DIR'])
          result=json.loads((run/'pcie-connected-memory-evidence.json').read_text())
          assert result['qualified_connected_memory_roundtrip'] is True
          assert result['over_link_bar0_qualified'] is True
          assert not result['issues']
          print('PASS: original host real connected PCIe memory readback and byte-provenance')
          PY
          # Negative mutations of this very run must fail the same checker.
          python3 - <<'PY'
          import os,pathlib,sys
          sys.path.insert(0,'tools')
          import pcie_connected_roundtrip_evidence as ev
          actual=(pathlib.Path(os.environ['RUN_DIR'])/'simulation.log').read_text()
          for old,new in (
              ('PCIE_CONNECTED_SRAM_DATA_OK:', 'PCIE_CONNECTED_SRAM_DATA_MISSING:'),
              ('PCIE_CONNECTED_EP_TX_CPLD:', 'PCIE_CONNECTED_EP_TX_CPLD_MISSING:'),
              ('PCIE_RC_BAR_MRD_CPLD_PASS:', 'PCIE_RC_BAR_MRD_CPLD_MISSING:'),
              ('PCIE_CONNECTED_SRAM_READ:', 'PCIE_CONNECTED_SRAM_READ_MISSING:'),
          ):
              assert old in actual
              assert not ev.check(actual.replace(old,new))['qualified_connected_memory_roundtrip'],old
          print('PASS: real observed evidence fail-closed negative mutations')
          PY
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Archive original compiler, simulator and source-validated evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcie-connected-memory-${{ github.run_id }}
          path: .tools/runs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
