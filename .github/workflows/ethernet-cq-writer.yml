name: Ethernet completion record real AXI DMA + SRAM
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/ethernet_cq_axi_writer.v'
      - 'dv/ethernet0/cq_writer_tb.v'
      - '.github/workflows/ethernet-cq-writer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cq:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL simulator and fetch pinned upstream IP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python3 -m pip install 'PyYAML==6.0.3'
          python3 tools/ip_fetch.py verilog_axi
      - name: Elaborate and test real completion writes and AXI B ownership
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s ethernet_cq_axi_writer_tb -o /tmp/eth_cq             rtl/io/ethernet0/ethernet_cq_axi_writer.v \
            dv/ethernet0/cq_writer_tb.v \
            .tools/verilog_axi/rtl/axi_dma_wr.v \
            .tools/verilog_axi/rtl/axi_ram.v
          vvp /tmp/eth_cq
