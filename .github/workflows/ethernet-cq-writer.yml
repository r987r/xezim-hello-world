name: Ethernet completion record real AXI DMA + SRAM
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/ethernet_cq_axi_writer.v'
      - 'dv/ethernet0/cq_writer_tb.v'
      - 'tools/ethernet_unit_workspace.py'
      - 'tools/ethernet_frame_workspace.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'tests/test_ethernet_unit_workspace.py'
      - 'config/ip.lock.yaml'
      - 'tools/ip_fetch.py'
      - '.github/workflows/ethernet-cq-writer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cq:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL simulator and fetch pinned upstream IP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python3 -m pip install 'PyYAML==6.0.3'
          python3 tools/ip_fetch.py verilog_axi
      - name: Check archive source and transcript custody
        run: python3 -m unittest tests.test_ethernet_unit_workspace -v
      - name: Elaborate and test real completion writes and AXI B ownership
        id: native-unit
        run: python3 tools/ethernet_unit_workspace.py cq-writer
      - name: Archive original isolated RTL unit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-cq-writer-native-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-unit.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Archive failed RTL unit diagnostics separately
        if: failure() && steps.native-unit.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-cq-writer-diagnostics-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-unit.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: warn
