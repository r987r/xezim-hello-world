name: Heterogeneous SoC AXI and CPU verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/soc.yaml'
      - 'config/regression.yaml'
      - 'config/interface_contracts.yaml'
      - 'config/ip.lock.yaml'
      - 'config/examples/**'
      - 'gen/**'
      - 'tools/bootgen.py'
      - 'tools/chip_bootgen.py'
      - 'tools/fabric_config.py'
      - 'tools/floonoc_gen.py'
      - 'tools/noc_backends.py'
      - 'tools/socgen.py'
      - 'tools/full_chip_gen.py'
      - 'tools/generate.py'
      - 'tools/interface_contracts.py'
      - 'tools/regress.py'
      - 'tools/sim_cocotb.py'
      - 'tools/ip_fetch.py'
      - 'tests/test_boot_policy.py'
      - 'tests/test_socgen.py'
      - 'tests/test_regression.py'
      - 'tests/test_axi_monitor_lifecycle.py'
      - 'tests/test_full_chip_gen.py'
      - 'tests/test_interface_contracts.py'
      - 'tests/test_fabric_config.py'
      - 'tests/test_floonoc_gen.py'
      - 'tests/test_ip_portability_contract.py'
      - 'tests/test_supernoc_gen.py'
      - 'dv/**'
      - 'rtl/**'
      - '!rtl/memory/ddr4/**'
      - 'Makefile'
      - 'Bender.yml'
      - 'Bender.lock'
      - '.github/actions/setup-bender/**'
      - '.github/workflows/dv-soc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dv-soc-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install configuration parser
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r csr/requirements.txt
      - name: Install pinned upstream FlooGen (no simulator rebuild)
        run: |
          set -euo pipefail
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Validate SoC configuration and generator
        run: make check-config
      - name: Reject generated-code or README drift, including obsolete files
        run: make check-generated
      - name: Download pinned Xezim executable (no simulator rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source toolchains/xezim.env
          mkdir -p .tools/bin
          gh release download "$XEZIM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$XEZIM_ASSET_NAME" \
            --pattern "$XEZIM_ASSET_NAME.sha256" \
            --dir .tools/bin
          (cd .tools/bin && sha256sum -c "$XEZIM_ASSET_NAME.sha256")
          chmod +x ".tools/bin/$XEZIM_ASSET_NAME"
          echo "XEZIM_BIN=$GITHUB_WORKSPACE/.tools/bin/$XEZIM_ASSET_NAME" >> "$GITHUB_ENV"
      - name: Run YAML-defined Xezim profiles and relocated cold boot
        run: python3 tools/regress.py xezim diagnostics
      - name: Verify canonical Xezim smoke/SRAM execution and source archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          from tools.run_workspace import require_completed_xezim_run
          tests = yaml.safe_load(Path('config/regression.yaml').read_text())['tests']
          for target in ('smoke', 'sram'):
              result = require_completed_xezim_run(
                  Path('.tools/runs'), target, tests[target])
              print('PASS canonical Xezim producer:', result['canonical_id'])
              if (Path('.tools/regression') / target).exists():
                  raise AssertionError('legacy test alias unexpectedly written: ' + target)
          PY
      - name: Retain resolved filelists, commands and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heterogeneous-soc-results
          path: |
            .tools/regression/
            .tools/runs/
            gen/boot/manifest.json
            gen/memory/manifest.json
          include-hidden-files: true
          if-no-files-found: error
