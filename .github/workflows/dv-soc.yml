name: Heterogeneous SoC AXI and CPU verification

on:
  push:
    paths:
      - 'config/**'
      - 'gen/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'tools/**'
      - 'tests/**'
      - 'dv/**'
      - 'rtl/**'
      - 'Makefile'
      - 'Bender.yml'
      - 'Bender.lock'
      - '.github/actions/setup-bender/**'
      - '.github/workflows/dv-soc.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'gen/**'
      - 'README.md'
      - 'tools/**'
      - 'tests/**'
      - 'dv/**'
      - 'rtl/**'
      - 'Makefile'
      - 'Bender.yml'
      - 'Bender.lock'
      - '.github/actions/setup-bender/**'
      - '.github/workflows/dv-soc.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish pinned Xezim Linux executable]
    types: [completed]

permissions:
  contents: read

jobs:
  simulate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install configuration parser
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install pinned upstream FlooGen (no simulator rebuild)
        run: |
          set -euo pipefail
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Validate SoC configuration and generator
        run: make check-config
      - name: Reject generated-code or README drift, including obsolete files
        run: make check-generated
      - name: Download pinned Xezim executable (no simulator rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source toolchains/xezim.env
          mkdir -p .tools/bin
          gh release download "$XEZIM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$XEZIM_ASSET_NAME" \
            --pattern "$XEZIM_ASSET_NAME.sha256" \
            --dir .tools/bin
          (cd .tools/bin && sha256sum -c "$XEZIM_ASSET_NAME.sha256")
          chmod +x ".tools/bin/$XEZIM_ASSET_NAME"
          echo "XEZIM_BIN=$GITHUB_WORKSPACE/.tools/bin/$XEZIM_ASSET_NAME" >> "$GITHUB_ENV"
      - name: Run YAML-defined Xezim profiles and relocated cold boot
        run: python3 tools/regress.py xezim diagnostics
      - name: Retain resolved filelists, commands and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heterogeneous-soc-results
          path: |
            .tools/regression/
            gen/boot/manifest.json
            gen/memory/manifest.json
          include-hidden-files: true
          if-no-files-found: error
