name: CSR runtime backdoor access policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/csr_runtime.py'
      - 'tools/run_csr_runtime_probe.py'
      - 'dv/csr_runtime/**'
      - 'tools/csr_backdoor.py'
      - 'tests/test_csr_runtime.py'
      - 'tests/test_csr_backdoor.py'
      - '.github/workflows/csr-backdoor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csr-runtime-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fail-closed live handle and logical-map unit tests
        run: |
          python3 -m unittest tests.test_csr_runtime tests.test_csr_backdoor -v
      - name: Verify no direct signal write API in runtime adapter
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path=Path('tools/csr_runtime.py')
          source=path.read_text()
          tree=ast.parse(source)
          assigns=[n for n in ast.walk(tree) if isinstance(n,(ast.Assign,ast.AugAssign,ast.AnnAssign))]
          for n in assigns:
              for target in (n.targets if isinstance(n,ast.Assign) else [n.target]):
                  if isinstance(target,ast.Attribute) and target.attr=='value':
                      raise AssertionError('CSR runtime must never write simulator signal value')
          assert 'direct CSR backdoor writes are disabled' in source
          print('PASS: runtime read-only CSR access contract')
          PY
      - name: Install real Verilator/Cocotb runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y verilator
          python3 -m pip install 'cocotb==1.9.2'
      - name: Resolve actual elaborated HDL signal and enforce safe quiescent read
        run: python3 tools/run_csr_runtime_probe.py
      - name: Verify true HDL snapshot stays source-selected and unqualified
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.tools/csr-runtime/csr-backdoor-map.json').read_text())
          assert data['schema_version'] == 1
          assert data['simulator'] == 'verilator'
          assert len(data['build_sha256']) == 64
          assert not data['frontdoor_equivalence_proven']
          assert not data['protocol_traffic_observed']
          assert len(data['fields']) == 2
          assert sum(x['read_evidence'] == 'quiescent_live_hdl_read_not_frontdoor_verified'
                     for x in data['fields']) == 1
          assert sum(x['read_evidence'] == 'not_available'
                     for x in data['fields']) == 1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csr-quiescent-hdl-source-evidence
          path: .tools/csr-runtime/csr-backdoor-map.json
          if-no-files-found: warn
