name: Ethernet MVP connected RX RTL and AXI CQ gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/**'
      - 'dv/ethernet0/**'
      - '.github/workflows/ethernet-mvp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ethernet-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  connected-rx:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ethernet and AXI simulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m pip install 'PyYAML==6.0.3' 'cocotb==1.9.2' \
            'cocotbext-axi==0.1.28' 'cocotbext-eth==0.1.28' 'cocotb-test==0.2.6'
          python3 tools/ip_fetch.py verilog_axi
      - name: Elaborate actual GMII MAC to CQ writer connectivity
        run: |
          python3 - <<'PY'
          from dv.ethernet0.run_mac_gmii import fetch_pinned
          from pathlib import Path
          import subprocess
          root=Path.cwd()
          sources=[root/"rtl/io/ethernet0"/name for name in (
              "ethernet0_rx_mvp.v","ethernet0_rx_gmii_stager.v",
              "ethernet0_mac_gmii.v","ethernet_rx_frame_stager.v",
              "ethernet_rx_queue_engine.v","ethernet_queue_ctrl.sv",
              "ethernet_rx_desc_fetch.v","ethernet_rx_dma.v",
              "ethernet_cq_axi_writer.v","ethernet_tx_dma.v",
              "ethernet0_tx_mvp.v",
          )]
          for directory,meta in fetch_pinned().values():
              sources.extend(directory/path for path in meta["modules"])
          sources.extend(root/".tools/verilog_axi/rtl"/name for name in (
              "axi_dma_rd.v","axi_dma_wr.v",
          ))
          subprocess.run(["iverilog","-g2012","-Wall",
                          "-s","ethernet0_rx_mvp","-t","null",
                          *(str(p) for p in sources)],check=True)
          subprocess.run(["iverilog","-g2012","-Wall",
                          "-s","ethernet0_tx_mvp","-t","null",
                          *(str(p) for p in sources)],check=True)
          print("PASS TX descriptor, upstream AXI DMA, MAC wire-completion and CQ RTL elaboration")
          print("PASS connected Ethernet GMII RX -> complete-frame -> queue -> AXI DMA and real CQ writer RTL elaboration")
          sources.extend((
              root/".tools/verilog_axi/rtl/axi_ram.v",
              root/"dv/ethernet0/ethernet0_rx_mvp_tb.v",
          ))
          from cocotb_test.simulator import run
          run(simulator="icarus",verilog_sources=[str(p) for p in sources],
              toplevel="ethernet0_rx_mvp_tb",
              module="dv.ethernet0.tb_rx_mvp",
              python_search=[str(root)],
              sim_build=str(root/".tools/regression/ethernet-mvp/sim_build"),
              timescale="1ns/1ps",waves=False)
          print("PASS real GMII RX -> SRAM packet -> 32-byte CQ AXI B and independent readback")
          PY
      - name: Archive structural source list
        if: always()
        run: |
          mkdir -p .tools/regression/ethernet-mvp
          git rev-parse HEAD > .tools/regression/ethernet-mvp/source-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ethernet-mvp-structural-${{ github.run_id }}
          path: .tools/regression/ethernet-mvp/
          if-no-files-found: warn
