name: HBM fabric AXI4 verification

on:
  push:
    paths:
      - 'config/**'
      - 'tools/socgen.py'
      - 'tests/**'
      - 'dv/**'
      - 'scripts/run-dv.sh'
      - 'Makefile'
      - 'toolchains/xezim.env'
      - 'dv/smoke/**'
      - '.github/workflows/dv-hbm.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'tools/socgen.py'
      - 'tests/**'
      - 'dv/**'
      - 'scripts/run-dv.sh'
      - 'Makefile'
      - 'toolchains/xezim.env'
      - 'dv/smoke/**'
      - '.github/workflows/dv-hbm.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish pinned Xezim Linux executable]
    types: [completed]

permissions:
  contents: read

jobs:
  config-and-hbm-axi:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python config dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Validate generator and negative configuration tests
        run: python -m unittest discover -s tests -v
      - name: Download reusable Xezim binary (never rebuild Rust)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source toolchains/xezim.env
          mkdir -p .tools/bin
          gh release download "$XEZIM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$XEZIM_ASSET_NAME" \
            --pattern "$XEZIM_ASSET_NAME.sha256" \
            --dir .tools/bin
          (cd .tools/bin && sha256sum -c "$XEZIM_ASSET_NAME.sha256")
          chmod +x ".tools/bin/$XEZIM_ASSET_NAME"
          echo "XEZIM_BIN=$GITHUB_WORKSPACE/.tools/bin/$XEZIM_ASSET_NAME" >> "$GITHUB_ENV"
      - name: Run AXI4 2x2 HBM fabric read/write burst regression
        shell: bash
        run: bash scripts/run-dv.sh | tee hbm-dv.log
      - name: Verify deliberately corrupted expected data is caught
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/run-dv.sh --negative > hbm-negative.log 2>&1; then
            echo 'ERROR: negative test unexpectedly passed'
            cat hbm-negative.log
            exit 1
          fi
          if ! grep -q 'FAIL AXI read' hbm-negative.log; then
            echo 'ERROR: negative test failed for the wrong reason'
            cat hbm-negative.log
            exit 1
          fi
          echo 'PASS: scoreboard rejected deliberately wrong read expectation'
      - name: Upload debugging data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hbm-dv-failure
          path: |
            hbm-dv.log
            hbm-negative.log
            generated/hbm/manifest.json
          if-no-files-found: ignore
