name: Regenerate full-chip NoC hierarchy and mesh diagrams (feature branch)
on:
  push:
    branches: [feat/checked-in-floonoc-rtl-20261102]
    paths:
      - 'tools/noc_diagrams.py'
      - 'tools/diagram_gen.py'
      - 'tools/generate.py'
      - 'tests/**'
      - '.github/workflows/regen-noc-diagrams-feature.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream FlooGen
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Generate real network hierarchy with diagrams and run 54+ tests
        run: |
          set -euo pipefail
          make gen
          make check-generated
          make check-config
          python3 -m unittest discover -s tests -p test_noc_diagrams.py -v
      - name: Commit exact generated diagrams, mesh Verilog and README references
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gen README.md
          if ! git diff --cached --quiet; then
            git commit -m "Track full-chip FlooNoC router and interconnect diagrams"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
