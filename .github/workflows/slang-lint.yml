name: Slang RTL lint and elaboration inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/slang-lint.yml'
      - '.github/actions/setup-bender/**'
      - 'toolchains/slang.env'
      - 'config/regression.yaml'
      - 'config/ip.lock.yaml'
      - 'config/interface_contracts.yaml'
      - 'config/soc.yaml'
      - 'Bender.yml'
      - 'Bender.lock'
      - 'rtl/**'
      - '!rtl/memory/ddr4/**'
      - 'gen/noc/**'
      - 'gen/supernoc/**'
      - 'gen/chip/**'
      - 'tools/regress.py'
      - 'tools/generate.py'
      - 'tools/lint_rtl.py'
      - 'tools/ip_fetch.py'
      - 'tools/idma_rtl.py'
      - 'tools/floonoc_gen.py'
      - 'tools/supernoc_gen.py'
      - 'tools/supernoc_interface_check.py'
      - 'tests/test_supernoc_interface_check.py'
      - 'tools/full_chip_gen.py'
      - 'tests/test_lint_rtl.py'
      - 'tests/test_signal_paths.py'
      - 'tests/test_design_netlist.py'
      - 'tools/signal_paths.py'
      - 'tools/design_netlist.py'
      - 'tools/design_elaborate.py'
      - 'tools/selected_rtl_provenance.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slang-lint-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The lint inventory includes the real chip-pcie-host RTL profile.
      # Reuse the exact immutable PCIe pin already tested in the host job.
      - uses: actions/checkout@v4
        with:
          repository: alexforencich/verilog-pcie
          ref: 25156a9a162c41c60f11f41590c7d006d015ae5a
          path: .tools/verilog_pcie
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install pinned RTL generator dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 -m pip install 'mako==1.3.10' 'hjson==3.1.0' 'peakrdl>=1.5.0' 'peakrdl-rawheader>=0.2.8' 'peakrdl-cheader>=1.1.0'
          python3 tools/ip_fetch.py floonoc pulp_idma
          python3 -m pip install -e .tools/floonoc
          # CPU C-DMA variants are now auto-discovered by the lint inventory.
          # Their existing compile/link step needs the same freestanding
          # LLVM toolchain used in full-chip CI.
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm lld iverilog
          command -v clang
          command -v llvm-objcopy
      - name: Install official checksum-verified slang release
        shell: bash
        run: |
          set -euo pipefail
          source toolchains/slang.env
          mkdir -p .tools/slang .tools/bin
          curl --fail --location --silent --show-error --retry 3 --output ".tools/slang/$SLANG_ARCHIVE" "$SLANG_URL"
          printf '%s  %s\n' "$SLANG_SHA256" ".tools/slang/$SLANG_ARCHIVE" | sha256sum --check
          tar -xzf ".tools/slang/$SLANG_ARCHIVE" -C .tools/slang
          candidate="$(find .tools/slang -type f -name slang -print -quit)"
          test -n "$candidate"
          cp "$candidate" .tools/bin/slang
          chmod +x .tools/bin/slang
          .tools/bin/slang --version
      - name: Validate lint runner without vendor RTL
        run: python3 -m unittest tests.test_lint_rtl -v
      - name: Check generated SuperNoC wrapper bindings without rebuilding netlist
        run: |
          python3 -m unittest tests.test_supernoc_interface_check -v
          python3 tools/supernoc_interface_check.py --output .tools/lint/supernoc-interface.json
      - name: Validate static netlist graph and selected-source fail-closed contracts
        run: python3 -m unittest tests.test_signal_paths tests.test_design_netlist -v
      - name: Validate generated RTL and resolve positive test filelists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make check-generated
          # One discovery contract for lint and Bender-resolved filelists.
          # Adding a new positive NoC/CPU RTL test cannot silently skip lint.
          mapfile -t lint_profiles < <(python3 tools/lint_rtl.py --list)
          test "${#lint_profiles[@]}" -gt 0
          printf 'Lint profiles: %s\n' "${lint_profiles[*]}"
          python3 tools/regress.py "${lint_profiles[@]}" --stage files
          # Every selected source closure must remain explainable and
          # independently verifiable after Bender actually resolves it.
          python3 tools/regress.py "${lint_profiles[@]}" --explain > .tools/lint/selected-targets.json
      - name: Export per-profile slang diagnostics and module elaboration evidence
        run: python3 tools/lint_rtl.py --slang .tools/bin/slang --output .tools/lint
      - name: Attach lint JSON, logs and resolved source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slang-rtl-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/lint/
            .tools/regression/*/sources.f
            .tools/regression/*/plan.json
            .tools/regression/*/selected-rtl-manifest.json
            .tools/regression/*/selected-rtl/** 
          include-hidden-files: true
          if-no-files-found: warn
