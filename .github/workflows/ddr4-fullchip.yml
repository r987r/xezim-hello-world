name: DDR-B real controller full-chip CPU and DMA

on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/memory/ddr4/**'
      - 'csr/rdl/ddr4_mode_registers.rdl'
      - 'tests/test_ddr_mrs_rdl.py'
      - 'dv/full_chip/**'
      - 'config/regression.yaml'
      - 'tools/ddr_chip.py'
      - 'tools/ddr_csr_catalog.py'
      - 'tools/address_map.py'
      - 'tests/test_ddr_csr_catalog.py'
      - 'tools/axi_report.py'
      - 'tools/full_chip_gen.py'
      - 'tools/cpu_dma_firmware.py'
      - 'tools/regress.py'
      - 'Bender.yml'
      - '.github/workflows/ddr4-fullchip.yml'
  workflow_dispatch:

concurrency:
  group: ddr-b-fullchip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-idma-ddr:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install pinned CPU/DMA/NoC and DDR generator dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt -r csr/requirements.txt
          python3 -m pip install 'mako==1.3.10' 'hjson==3.1.0' 'peakrdl>=1.5.0' 'peakrdl-rawheader>=0.2.8' 'peakrdl-cheader>=1.1.0'
          python3 -m pip install 'cocotb==1.9.2' 'cocotbext-axi==0.1.28' 'cocotb-test==0.2.6'
          python3 tools/ip_fetch.py floonoc pulp_idma litedram
          python3 -m pip install -e .tools/floonoc
          python3 - <<'PY'
          import pathlib, re, subprocess, yaml
          pin = yaml.safe_load(pathlib.Path("rtl/memory/ddr4/toolchain.lock.yml").read_text())["litex"]
          assert re.fullmatch(r"[0-9a-f]{40}", pin["commit"])
          dest = pathlib.Path(".tools/litex")
          dest.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(["git", "init", "-q", str(dest)], check=True)
          subprocess.run(["git", "-C", str(dest), "remote", "add", "origin", pin["git"]], check=True)
          subprocess.run(["git", "-C", str(dest), "fetch", "-q", "--depth", "1", "origin", pin["commit"]], check=True)
          subprocess.run(["git", "-C", str(dest), "checkout", "-q", "--detach", pin["commit"]], check=True)
          assert subprocess.check_output(["git", "-C", str(dest), "rev-parse", "HEAD"], text=True).strip() == pin["commit"]
          PY
          python3 -m pip install -e .tools/litex
          python3 -m pip install --no-deps -e .tools/litedram
          python3 -m pip install 'pythondata-misc-tapcfg==0.0.post517'
          sudo apt-get update -qq
          sudo apt-get install -y verilator clang llvm lld
      - name: Verify baseline generator and CPU/DDR implementation Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ddr_chip.py tools/full_chip_gen.py tools/regress.py tools/cpu_dma_firmware.py dv/full_chip/ddr_init.py dv/full_chip/test_ddr_real.py dv/full_chip/test_boot.py
          python3 -m unittest tests.test_regression tests.test_full_chip_gen tests.test_axi_agent_ownership -v
          make check-generated
      - name: Generate actual pinned LiteDRAM and upstream-derived DFII commands
        run: |
          set -euo pipefail
          python3 rtl/memory/ddr4/bringup.py generate
          python3 -m unittest discover -s rtl/memory/ddr4 -p 'test_*.py'
          python3 -m unittest tests.test_ddr_mrs_rdl -v
      - name: Audit independent pinned LiteDRAM generation for unqualified source drift
        run: |
          python3 rtl/memory/ddr4/bringup.py generate --output-dir .tools/ddr4/repeatability-second
          python3 rtl/memory/ddr4/repro_audit.py \
            --first .tools/ddr4/litedram_sim \
            --second .tools/ddr4/repeatability-second \
            --out .tools/ddr4/ddr-source-repeatability.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.tools/ddr4/ddr-source-repeatability.json').read_text())
          assert report['schema_version']==1
          assert report['qualification'].endswith('not_equivalence_or_ddr_traffic')
          print('DDR generated RTL byte repeatable:',report['repeatable'])
          print('DDR differing paths:',report['changed_generated_paths'])
          PY
          python3 -m unittest tests.test_ddr_csr_catalog tests.test_ddr_csr_pages -v
      - name: Build exact-head real LiteDRAM full-chip RTL
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python3 tools/regress.py chip-ddr4-real --stage build --fail-fast
          test -x .tools/chip-ddr4-real-obj/full_chip_tb
      - name: Run real CPU/iDMA to real LiteDRAM through generated Data and Config NoCs
        timeout-minutes: 55
        run: |
          set -euo pipefail
          # Same fingerprint-verified binary as the prior step: compilation
          # time must not consume our expensive simulation budget.
          python3 tools/regress.py chip-ddr4-real --stage run --fail-fast
          test -s .tools/regression/chip-ddr4-real/ddr4_fullchip_evidence.json
          test -s .tools/regression/chip-ddr4-real/ddr4_mrs_evidence.json
          test -s .tools/regression/chip-ddr4-real/report.html
          test -s .tools/regression/chip-ddr4-real/ddr-native-csr-map.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.tools/regression/chip-ddr4-real')
          evidence=json.loads((p/'ddr4_fullchip_evidence.json').read_text())
          assert evidence['status']=='pass'
          assert evidence['init_done']==1 and evidence['init_error']==0
          mrs=json.loads((p/'ddr4_mrs_evidence.json').read_text())
          assert mrs['status']=='pass' and mrs['observed_mrs_count']==7, mrs
          assert [r['mr'] for r in mrs['records']]==[3,6,5,4,2,1,0], mrs
          assert not mrs['model_enforces_mr_state'] and not mrs['jedec_mrs_timing_verified']
          assert evidence['mrs']['status']=='pass' and evidence['mrs']['count']==7
          assert all(evidence[key]>0 for key in ('axi_aw','axi_b','axi_ar','axi_rlast','dfi_read','dfi_write','bank_storage_write'))
          assert evidence['axi_aw']==evidence['axi_b'] and evidence['axi_ar']==evidence['axi_rlast']
          negative=evidence['routed_negative']
          assert negative['status']=='pass', negative
          assert negative['source']=='compute0_local_data.dma', negative
          assert negative['bad_write_resp']==3 and negative['bad_read_resp']==3, negative
          assert negative['no_controller_forwarding'] and negative['nonaliased_valid_readback'], negative
          native=json.loads((p/'ddr-native-csr-map.json').read_text())
          assert native['variant']=='ddr_real' and native['register_count']>0
          assert native['native_csr_sha256'] and native['config_sha256']
          trace=json.loads((p/'axi-transactions.json').read_text())
          mapping=trace['sections']['address_map']
          assert mapping['variant']=='ddr_real'
          ctrl=next(r for r in mapping['regions'] if r['name']=='memory0.ctrl')
          ddr=next(r for r in mapping['regions'] if r['name']=='memory0.ddr0')
          assert ctrl['base']=='0x40030000' and ctrl['size']=='0x4000'
          assert len(ctrl['registers'])==native['register_count']
          assert ddr['modeled_capacity_bytes']==32*1024*1024
          assert all(r['definition_status']=='native_LiteDRAM_generated_CSR_not_bus_coverage'
                     for r in ctrl['registers'])
          assert ctrl['observations']['capture']=='measured', ctrl
          assert ctrl['observations']['reads_ok']>0
          assert ctrl['observations']['writes_ok']>0
          report=json.loads((p/'result.json').read_text())
          assert report['passed'], report
          protocol=json.loads((p/'protocol-transactions.json').read_text())
          assert protocol['schema_version']==1 and protocol['capture_complete']
          assert protocol['run']['target']=='chip-ddr4-real'
          dfi=[r for r in protocol['records']
               if r['source']=='memory0.ddr0.dfi']
          bank=[r for r in protocol['records']
                if r['source']=='memory0.ddr0.bankmodel']
          assert dfi and bank, 'missing continuous DFI and modeled storage observations'
          commands={r['operation'] for r in dfi}
          assert {'rd','wr'} <= commands, commands
          assert all(r['kind']=='event' for r in dfi+bank)
          assert all(r['start_ps'] is not None for r in dfi+bank)
          assert evidence['dfi_sampled_cycles']>0
          assert evidence['dfi_commands']['read']>0 and evidence['dfi_commands']['write']>0
          print('PASS source-verified full-chip DFI commands:',sorted(commands),
                'events=',len(dfi),'bank=',len(bank))

          print('PASS DDR-B full-chip real-controller source/capture contract')
          PY
      - name: Upload exact-head RTL, NoC files, CPU DMA reports and DFI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddr4-fullchip-cpu-dma-evidence
          path: |
            .tools/ddr4/litedram_sim/ddr4_manifest.json
            .tools/ddr4/ddr-source-repeatability.json
            .tools/ddr4/litedram_sim/csr.json
            .tools/ddr4/litedram_sim/ddr4_init_plan.json
            .tools/regression/chip-ddr4-real/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
