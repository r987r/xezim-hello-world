name: Checked-in FlooGen local and global NoC RTL

on:
  push:
    paths:
      - 'config/**'
      - 'gen/noc/floonoc/**'
      - 'tools/floonoc_gen.py'
      - '.github/workflows/floogen.yml'
  pull_request:
    paths:
      - 'config/floogen/**'
      - 'toolchains/floogen.env'
      - 'docs/subsystem-verification.md'
      - '.github/workflows/floogen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floogen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream FlooNoC/FlooGen
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Validate subsystem and global interface budgets and link widths
        run: |
          python3 tools/interface_contracts.py --output .tools/interface-contracts.json
          python3 -m unittest discover -s tests -p test_interface_contracts.py -v
      - name: Recreate and verify all tracked upstream FlooNoC RTL
        run: |
          set -euo pipefail
          make check-generated
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("gen/noc/floonoc")
          manifest=json.loads((root/"manifest.json").read_text())
          if len(manifest["networks"]) != 8:
              raise SystemExit("missing expected eight independent FlooNoCs")
          for name, entry in manifest["networks"].items():
              top=(root / entry["top"]).read_text()
              pkg=(root / entry["package"]).read_text()
              if "floo_axi_router" not in top or "floo_axi_chimney" not in top:
                  raise SystemExit("missing real upstream router or chimney: "+name)
              if "xezim_chimney_cfg()" not in top:
                  raise SystemExit("native AXI pending limits not bound: "+name)
              if not pkg.strip() or "package " not in pkg:
                  raise SystemExit("missing generated FlooNoC package: "+name)
          print("PASS: all eight checked-in upstream FlooNoC modules/packages and configs are reproducible")
          PY
