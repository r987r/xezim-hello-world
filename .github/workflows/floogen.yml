name: Checked-in FlooGen local and global NoC RTL

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/soc.yaml'
      - 'config/interface_contracts.yaml'
      - 'config/ip.lock.yaml'
      - 'config/examples/**'
      - 'gen/noc/floonoc/**'
      - 'tools/floonoc_gen.py'
      - 'tools/supernoc_gen.py'
      - 'tools/interface_contracts.py'
      - 'tools/noc_backends.py'
      - 'tools/ip_fetch.py'
      - 'tools/regress.py'
      - 'tests/test_floonoc_gen.py'
      - 'tests/test_interface_contracts.py'
      - 'tests/test_supernoc_gen.py'
      - '.github/workflows/floogen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floogen-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  floogen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream FlooNoC/FlooGen
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Validate subsystem and global interface budgets and link widths
        run: |
          python3 tools/interface_contracts.py --output .tools/interface-contracts.json
          python3 -m unittest discover -s tests -p test_interface_contracts.py -v
      - name: Recreate and verify all tracked upstream FlooNoC RTL
        run: |
          set -euo pipefail
          make check-generated
          python3 tools/regress.py --check-noc
