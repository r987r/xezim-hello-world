name: Checked-in FlooGen local and global NoC RTL

on:
  push:
    paths:
      - 'config/**'
      - 'gen/noc/floonoc/**'
      - 'tools/**'
      - '.github/workflows/floogen.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'gen/noc/floonoc/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/subsystem-verification.md'
      - '.github/workflows/floogen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floogen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream FlooNoC/FlooGen
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Validate subsystem and global interface budgets and link widths
        run: |
          python3 tools/interface_contracts.py --output .tools/interface-contracts.json
          python3 -m unittest discover -s tests -p test_interface_contracts.py -v
      - name: Recreate and verify all tracked upstream FlooNoC RTL
        run: |
          set -euo pipefail
          make check-generated
          python3 tools/regress.py --check-noc
