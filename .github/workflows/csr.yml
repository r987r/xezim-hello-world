name: CSR and unified address-map contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'csr/**'
      - 'tools/csrgen.py'
      - 'tools/run_csr_axi.py'
      - 'dv/csr/**'
      - 'tools/full_chip_gen.py'
      - 'tools/regress.py'
      - 'tests/test_full_chip_gen.py'
      - 'config/regression.yaml'
      - 'tools/csr_backdoor.py'
      - 'tools/address_map.py'
      - 'tests/test_csr_backdoor.py'
      - 'tests/test_address_map.py'
      - 'tools/axi_report.py'
      - 'tools/templates/run_report.html'
      - '.github/workflows/csr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csr-architectural:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository and pinned CSR toolchains
        run: |
          python3 -m pip install -r requirements.txt -r csr/requirements.txt
      - name: Verify SystemRDL, CSR backdoor and physical address-map contracts
        run: |
          python3 -m unittest tests.test_csr_backdoor tests.test_address_map tests.test_axi_report tests.test_regression -v
      - name: Generate and deterministically re-check CSR artifacts
        run: |
          python3 tools/csrgen.py --out .tools/csr-verified --variant cold_boot
          python3 tools/csrgen.py --out .tools/csr-verified --variant cold_boot --check
      - name: Compose full SoC address map with RDL CSR subset
        run: |
          python3 tools/address_map.py --csr-map .tools/csr-verified/csr-map.json --variant cold_boot --out .tools/soc-address-map.json --rdl-out .tools/soc-data-memories.rdl
          python3 - <<'PY'
          import json
          from pathlib import Path
          from systemrdl import RDLCompiler
          result=json.loads(Path('.tools/soc-address-map.json').read_text())
          assert len(result['regions']) == 14
          assert len([r for r in result['regions'] if r['registers']]) == 1
          assert result['regions'][-1]['plane'] == 'config'
          c=RDLCompiler()
          c.compile_file('.tools/soc-data-memories.rdl')
          root=c.elaborate(top_def_name='soc_data_memory_view')
          from systemrdl.node import MemNode
          assert sum(isinstance(n, MemNode) for n in root.top.children()) == 8
          print('PASS: RDL external data memories and unified CSR subset')
          PY

  csr-rtl-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install pinned CSR and cocotb/Verilator tools
        run: |
          python3 -m pip install -r requirements.txt -r csr/requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
          python3 -m pip install 'cocotb==1.9.2' 'cocotbext-axi==0.1.24'
          sudo apt-get update -qq
          sudo apt-get install -y verilator clang llvm lld
      - name: Verify opt-in top generation and configuration
        run: |
          python3 -m unittest tests.test_full_chip_gen tests.test_regression -v
      - name: Compile generated C CSR headers with real RV32I target
        run: |
          python3 tools/csrgen.py --out .tools/csr-smoke --variant cold_boot
          clang --target=riscv32-unknown-elf -march=rv32i -mabi=ilp32 -std=c11 -Wall -Wextra -Werror -Oz -ffunction-sections -fdata-sections -I .tools/csr-smoke -c tests/fixtures/csr_headers_smoke.c -o .tools/csr-smoke/csr_headers_smoke.o
      - name: Fast standalone generated AXI-Lite register behavior
        run: python3 tools/run_csr_axi.py
      - name: Simulate CPU cold boot through PeakRDL Config NoC
        run: python3 tools/regress.py chip-peakrdl-reset --fail-fast
      - name: Verify qualified CSR catalog and observed Config-NoC traffic
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.tools/regression/chip-peakrdl-reset')
          catalog=json.loads((root/'csr/csr-map.json').read_text())
          assert catalog['variant']=='cold_boot'
          assert catalog['register_count']==2
          real=json.loads((root/'axi-transactions.json').read_text())
          mapping=real['sections']['address_map']
          assert mapping['variant']=='cold_boot'
          reset=[r for r in mapping['regions'] if r['name']=='boot.reset_ctrl']
          assert len(reset)==1 and len(reset[0]['registers'])==2
          regs={r['name']:r for r in reset[0]['registers']}
          assert regs['cpu_release']['address']=='0x40020000'
          assert regs['secondary_ack[0]']['address']=='0x40020004'
          assert reset[0]['observations']['reads_ok']>=1
          assert reset[0]['observations']['writes_ok']>=1
          print('PASS: exact compiled CSR variant plus passive real AXI frontdoor traffic')
          PY
      - name: Upload CSR RTL compile and traffic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csr-peakrdl-real-chip-boot
          path: .tools/regression/chip-peakrdl-reset/
          include-hidden-files: true
          if-no-files-found: warn
