name: Full-chip coordinated CPU boot

on:
  pull_request:
    branches: [main]
    paths: ['config/soc.yaml', 'config/regression.yaml', 'config/interface_contracts.yaml', 'config/ip.lock.yaml', 'gen/**', 'tools/chip_bootgen.py', 'tools/full_chip_gen.py', 'tools/sim_cocotb.py', 'tools/regress.py', 'tools/run_workspace.py', 'tools/selected_rtl_provenance.py', 'tools/axi_report.py', 'tools/fabric_config.py', 'tools/generate.py', 'tools/ip_fetch.py', 'rtl/**', '!rtl/memory/ddr4/**', 'dv/full_chip/**', 'dv/dma/**', 'dv/common/axi_trace.py', 'dv/common/dma_vectors.py', 'sw/common/**', 'sw/dma/**', 'tests/test_dma*', 'tests/test_memory_plan.py', 'tools/memory_plan.py', 'tests/test_full_chip_gen.py', 'tests/test_boot_policy.py', 'tests/test_cpu_dma_probe.py', 'tests/test_axi_agent_ownership.py', 'tests/test_rv32i_runtime.py', 'tests/test_cpu_dma_firmware.py', 'tools/cpu_dma_firmware.py', 'tools/csr_reset_axi_evidence.py', 'tests/test_csr_reset_axi_evidence.py', 'tests/test_regression.py', 'Bender.yml', 'Bender.lock', 'Makefile', '.github/actions/setup-bender/**', '.github/workflows/full-chip.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-chip-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Run exact CPU compiler/runtime and shared memory checks BEFORE the
  # 10+ minute upstream IP generation/Verilator build. A failure here does
  # not burn CPU time on a full-chip simulator that cannot run the image.
  firmware-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal firmware-toolchain dependencies
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm lld
          command -v clang
          command -v ld.lld
          command -v llvm-objcopy
      - name: Fast CPU ELF link, memory allocator and probe-ownership tests
        run: |
          python3 -m unittest tests.test_rv32i_runtime tests.test_cpu_dma_firmware tests.test_cpu_dma_probe tests.test_axi_agent_ownership tests.test_dma_sw tests.test_memory_plan tests.test_csr_reset_axi_evidence -v
  boot:
    needs: firmware-preflight
    runs-on: ubuntu-24.04
    # CI 42234770010 completed all five dv-chip targets, but ran out of
    # the previous 45-minute job budget during final report/artifact steps.
    # Keep the job bounded while allowing evidence publishing to complete.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install pinned upstream generation and verification tools
        run: |
          python3 -m pip install -r requirements.txt -r csr/requirements.txt \
            'mako==1.3.10' 'hjson==3.1.0' 'peakrdl>=1.5.0' 'peakrdl-rawheader>=0.2.8'
          python3 tools/ip_fetch.py floonoc pulp_idma
          python3 -m pip install -e .tools/floonoc
          python3 -m pip install 'cocotb==1.9.2' 'cocotbext-axi==0.1.24'
          sudo apt-get update -qq
          sudo apt-get install -y verilator clang llvm lld
      - name: Verify configuration and generated chip/firmware
        run: make check-config check-generated
      - name: Fetch checksum-verified Xezim release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source toolchains/xezim.env
          gh release download "$XEZIM_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$XEZIM_ASSET_NAME" --pattern "$XEZIM_ASSET_NAME.sha256" --dir .tools/bin
          (cd .tools/bin && sha256sum -c "$XEZIM_ASSET_NAME.sha256")
          chmod +x ".tools/bin/$XEZIM_ASSET_NAME"
          echo "XEZIM_BIN=$GITHUB_WORKSPACE/.tools/bin/$XEZIM_ASSET_NAME" >> "$GITHUB_ENV"
      - name: 'Run common SoC INIT/RUN/CHECK: real CPU C DMA, dual BFM DMA, negatives, Xezim compile'
        id: run-full-chip
        run: make dv-chip FAST_FAIL=1
      - name: Locate only the selected full-chip evidence
        if: always()
        id: chip-runs
        env:
          SIMULATION_OUTCOME: ${{ steps.run-full-chip.outcome }}
        run: |
          PYTHONPATH=tools python3 - <<'PYRUN'
          import os
          from pathlib import Path
          import yaml
          from run_workspace import selected_run_folder

          root = Path.cwd()
          catalog = yaml.safe_load((root / "config/regression.yaml").read_text())["tests"]
          directories = []
          for name in ("chip-boot", "chip-boot-negative", "chip-boot-latency",
                       "chip-dma", "chip-cpu-dma"):
              workspace = selected_run_folder(root, name, catalog[name])
              if name == "chip-cpu-dma" and os.environ["SIMULATION_OUTCOME"] == "success" and (
                      workspace is None or not (workspace / "result.json").is_file()):
                  raise SystemExit("successful chip-cpu-dma regression lacks canonical result")
              if workspace is not None:
                  relative = workspace.relative_to(root / ".tools/runs")
                  directories.append((Path(".tools/runs") / relative).as_posix())

          with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
              print("directories<<CHIP_BOOT_PATHS", file=outputs)
              for directory in directories:
                  print(f"{directory}/", file=outputs)
              print("CHIP_BOOT_PATHS", file=outputs)
              print("reports<<CHIP_BOOT_PATHS", file=outputs)
              reports = [f"{directory}/{member}" for directory in directories
                         for member in ("report.html", "axi-*.json*")]
              # The upload expression restores the first root prefix so
              # Pages recognizes the archive without a broad capture glob.
              if reports:
                  print("\n".join(reports).removeprefix(".tools/runs/"), file=outputs)
              print("CHIP_BOOT_PATHS", file=outputs)
          PYRUN
      - name: Retain all chip build/phase/memory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-chip-boot-results
          path: |
            ${{ steps.chip-runs.outputs.directories }}
            .tools/runs/xezim/
            gen/chip/
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish AXI run explorer pages and transaction data
        if: always() && steps.chip-runs.outputs.reports != ''
        uses: actions/upload-artifact@v4
        with:
          name: chip-axi-run-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ format('.tools/runs/{0}', steps.chip-runs.outputs.reports) }}
          include-hidden-files: true
          if-no-files-found: warn
