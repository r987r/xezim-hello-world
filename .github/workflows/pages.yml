name: Publish SoC verification hub

# PRs targeting main and manual dispatch are the only automatic entry points.
# Open PRs preview; merged PRs dispatch a separate main-ref run for Pages.
# Manual feature-branch dispatch builds preview only and can never deploy.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  dispatch-after-merge:
    # The GitHub Pages environment must see a workflow whose *run ref* is
    # main, not a PR run whose checkout happens to use main.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start one trusted main-ref publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Verify publication, CI trigger and report semantics
        run: python3 -m unittest tests.test_ci_workflows tests.test_publication tests.test_merged_pr_evidence tests.test_axi_report tests.test_fabric_report tests.test_protocol_report tests.test_design_explorer tests.test_design_netlist -v
      - name: Build offline PR or manual branch preview
        if: (github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        run: python3 tools/publish_site.py
      - name: Collect verified merged-PR and main evidence
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_site.py --collect
      - name: Verify offline 2D diagram preview has embedded graph data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re
          html = Path('.tools/pages-site/explorer.html').read_text()
          match = re.search(r'<script type="application/json" id="ex-embedded-graph">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('missing embedded 2D graph in Pages preview')
          data = json.loads(match.group(1))
          assert len(data['nodes']) >= 8, 'no diagram nodes'
          assert len(data['edges']) >= 8, 'no diagram connections'
          assert data['profiles']['chip-dma']['actors'], 'missing DMA testbench overlay'
          assert 'fetch("data/design-graph.json")' not in html, 'preview still requires HTTP fetch'
          assert Path('.tools/pages-site/data/design-graph.json').is_file(), 'graph download missing'
          print('PASS: self-contained 2D explorer, graph and chip-DMA profile')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .tools/pages-site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Select Actions publishing for the enabled Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_site.py --ensure-pages
      - uses: actions/configure-pages@v5
      - name: Deploy documentation and verified run evidence
        id: deployment
        uses: actions/deploy-pages@v4
