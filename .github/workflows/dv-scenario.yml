name: DV scenario contract (SCN-1 + SCN-2)

on:
  pull_request:
    branches: [main]
    paths:
      - 'dv/common/scenario.py'
      - 'dv/common/action_runtime.py'
      - 'tests/test_action_runtime.py'
      - 'dv/common/scenario_dma.py'
      - 'dv/full_chip/test_boot.py'
      - 'dv/full_chip/test_dma.py'
      - 'sw/dma/tests/scenario_dma_run.c'
      - 'tools/cpu_dma_firmware.py'
      - 'tools/scenario_memory_trace.py'
      - 'tests/test_scenario_memory_trace.py'
      - 'tests/test_scenario_memory_finalization.py'
      - 'tools/regress.py'
      - 'config/regression.yaml'
      - 'tests/test_scenario_dma.py'
      - 'tools/scenario_replay_audit.py'
      - 'tools/scenario_cpu_plan_witness.py'
      - 'tests/test_scenario_cpu_plan_witness.py'
      - 'tools/scenario_cpu_action_trace.py'
      - 'tests/test_scenario_cpu_action_trace.py'
      - 'tests/test_cpu_scenario_firmware_elf.py'
      - 'tools/scenario_c.py'
      - 'sw/common/soc_scn_action_adapter.h'
      - 'sw/common/soc_scn_action_args.h'
      - 'tests/test_scenario_replay_audit.py'
      - 'tools/scenario_plan.py'
      - 'tools/scenario_seed_matrix.py'
      - 'tests/test_scenario_seed_matrix.py'
      - 'tools/memory_plan.py'
      - 'tools/sram_layout.py'
      - 'config/scenarios/**'
      - 'config/soc.yaml'
      - 'tests/test_scenario_plan.py'
      - '.github/workflows/dv-scenario.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dv-scenario-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenario-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing configuration parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Test typed scenarios, allocator contract and multi-seed replay
        run: python3 -m unittest tests.test_scenario_plan tests.test_scenario_seed_matrix tests.test_action_runtime tests.test_scenario_dma tests.test_scenario_cpu_plan_witness tests.test_scenario_cpu_action_trace tests.test_scenario_replay_audit tests.test_memory_plan tests.test_dma_vectors -v
      - name: Resolve and independently verify directed plus randomized SCN plan matrix
        run: |
          python3 tools/scenario_seed_matrix.py --scenario config/scenarios/dma-roundtrip.json --soc config/soc.yaml --out .tools/scenarios/ci-seed-matrix --seeds 1 22 31337 --source-revision "${GITHUB_SHA}"
          python3 tools/scenario_seed_matrix.py --scenario config/scenarios/dma-roundtrip.json --soc config/soc.yaml --out .tools/scenarios/ci-seed-matrix --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-selected-intent-seed-matrix
          path: .tools/scenarios/ci-seed-matrix/
          if-no-files-found: warn
      - name: Materialize intent-only manifest with source provenance
        run: |
          python3 tools/scenario_plan.py --scenario config/scenarios/dma-roundtrip.json --soc config/soc.yaml --out .tools/scenarios/smoke/scenario-plan.json --source-revision "${GITHUB_SHA}"
          python3 -c 'import json; p=json.load(open(".tools/scenarios/smoke/scenario-plan.json")); assert p["kind"] == "soc_scenario_intent_only" and p["execution_evidence"] is None'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-plan-intent-only
          path: .tools/scenarios/smoke/scenario-plan.json
          if-no-files-found: ignore

  scenario-cpu-elf:
    name: Fast freestanding selected CPU C scenario RV32I link preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install compiler and firmware configuration dependencies
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm lld
      - name: Link actual selected scenario CPU with two source replay seeds
        env:
          SOC_REQUIRE_SCENARIO_RV32I_TOOLS: '1'
        run: |
          command -v clang
          command -v llvm-objcopy
          command -v ld.lld
          python3 -m unittest tests.test_cpu_scenario_firmware_elf -v

  scenario-real-rtl:
    name: CPU C and BFM use same plan on generated FlooNoC RTL
    needs: [scenario-schema, scenario-cpu-elf]
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bender
        env: {GH_TOKEN: "${{ github.token }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned real NoC/iDMA/C toolchains
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install 'mako==1.3.10' 'hjson==3.1.0' 'peakrdl>=1.5.0' 'peakrdl-rawheader>=0.2.8' 'peakrdl-cheader>=1.1.0'
          python3 tools/ip_fetch.py floonoc pulp_idma
          python3 -m pip install -e .tools/floonoc
          python3 -m pip install 'cocotb==1.9.2' 'cocotbext-axi==0.1.24'
          sudo apt-get update -qq
          sudo apt-get install -y verilator clang llvm lld
      - name: Check source ABI, CPU C and generated platform
        run: |
          python3 -m unittest tests.test_scenario_plan tests.test_scenario_dma tests.test_scenario_cpu_plan_witness tests.test_scenario_cpu_action_trace tests.test_scenario_replay_audit tests.test_scenario_memory_trace tests.test_scenario_memory_finalization tests.test_cpu_dma_firmware -v
          make check-generated
      - name: Execute two freshly randomized source-selected scenarios in actual CPU and BFM RTL
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          from tools.scenario_seed_matrix import write_matrix, check_matrix
          from tools.scenario_replay_audit import audit

          source = Path("config/scenarios/cpu-bfm-ddr-roundtrip.json")
          soc = Path("config/soc.yaml")
          matrix_dir = Path(".tools/scenarios/rtl-seed-matrix/selected")
          matrix = write_matrix(source, soc, matrix_dir, random_runs=32)
          check_matrix(source, soc, matrix_dir)
          by_pattern = {}
          for item in matrix["cases"]:
              plan = json.loads((matrix_dir / item["file"]).read_text())
              source_init = next(a for a in plan["actions"]
                                 if a["action_instance_id"] == "init_source")
              value = source_init["args"]["pattern"]["seed"]
              if plan["seed"] != 79 and value not in by_pattern:
                  by_pattern[value] = item
          if len(by_pattern) < 2:
              raise RuntimeError("random cases did not exercise two different real payloads")
          selected = list(by_pattern.values())[:2]
          collected = []
          root = Path(".tools/scenarios/rtl-seed-matrix")
          for item in selected:
              seed = item["seed"]
              print(f"REAL RTL RANDOM SEED {seed}; plan {item['plan_sha256']}", flush=True)
              subprocess.run([sys.executable, "tools/regress.py", "scenario",
                              "--scenario-seed", str(seed)], check=True)
              cpu = Path(".tools/regression/chip-cpu-scenario")
              bfm = Path(".tools/regression/chip-dma-scenario")
              expected = (matrix_dir / item["file"]).read_bytes()
              for actual in (cpu/"variant/scenario-plan.json", bfm/"scenario-plan.json"):
                  if actual.read_bytes() != expected:
                      raise RuntimeError(f"{actual}: executed RTL plan differs from selected matrix")
              verified = audit(cpu, bfm)
              if verified["plan_sha256"] != item["plan_sha256"]:
                  raise RuntimeError("actual observed evidence differs from selected seed plan")
              case = root / f"seed-{seed}"
              case.mkdir(parents=True, exist_ok=False)
              for folder in (cpu, bfm):
                  shutil.copytree(folder, case/folder.name)
              (case/"scenario-replay-audit.json").write_text(
                  json.dumps(verified, indent=2, sort_keys=True)+"\n")
              # Keep each complete original run as its own compressed archive.
              # The current Pages importer accepts one result per legacy target
              # per workflow. Publishing multiple target-named result.json files
              # from one artifact would falsely collide until #139 canonical
              # per-execution ingestion is fully migrated.
              archive = shutil.make_archive(str(case), "gztar",
                                            root_dir=root, base_dir=case.name)
              shutil.rmtree(case)
              collected.append({"seed":seed, "plan_sha256":item["plan_sha256"],
                                "pattern_seed":next(a for a in json.loads(expected)["actions"]
                                                    if a["action_instance_id"]=="init_source")
                                               ["args"]["pattern"]["seed"],
                                "archive":Path(archive).name,
                                "evidence":"real_cpu_and_bfm_passive_AXI_and_independent_bytes",
                                "status":verified["status"]})
          check_matrix(source, soc, matrix_dir)
          if len({x["seed"] for x in collected}) != 2 or len({x["pattern_seed"] for x in collected}) != 2:
              raise RuntimeError("real RTL random replay did not vary scenario seed and payload")
          summary = {"schema_version":1, "source_revision":os.environ["GITHUB_SHA"],
                     "matrix_sha256":hashlib.sha256((matrix_dir/"matrix.json").read_bytes()).hexdigest(),
                     "status":"validated_two_distinct_random_real_rtl_scenarios",
                     "cases":collected}
          (root/"executed-matrix.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("PASS two distinct genuinely random SCN-2 CPU/BFM real RTL cases",flush=True)
          PY
      - name: Retain manifest, RTL traces, per-run reports, CPU and BFM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dv-scenario-rtl-${{ github.run_id }}
          path: |
            .tools/regression/chip-cpu-scenario/
            .tools/regression/chip-dma-scenario/
            .tools/scenarios/rtl-seed-matrix/
          include-hidden-files: true
          if-no-files-found: warn
