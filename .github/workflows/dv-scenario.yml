name: DV scenario contract (SCN-1)

on:
  pull_request:
    paths:
      - 'dv/common/scenario.py'
      - 'tools/scenario_plan.py'
      - 'tools/memory_plan.py'
      - 'tools/sram_layout.py'
      - 'config/scenarios/**'
      - 'config/soc.yaml'
      - 'tests/test_scenario_plan.py'
      - '.github/workflows/dv-scenario.yml'
  push:
    branches: [main]
    paths:
      - 'dv/common/scenario.py'
      - 'tools/scenario_plan.py'
      - 'config/scenarios/**'
      - 'tests/test_scenario_plan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing configuration parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Test typed scenarios, allocator contract and replay
        run: python3 -m unittest tests.test_scenario_plan tests.test_memory_plan tests.test_dma_vectors -v
      - name: Materialize intent-only manifest with source provenance
        run: |
          python3 tools/scenario_plan.py --scenario config/scenarios/dma-roundtrip.json --soc config/soc.yaml --out .tools/scenarios/smoke/scenario-plan.json --source-revision "${GITHUB_SHA}"
          python3 -c 'import json; p=json.load(open(".tools/scenarios/smoke/scenario-plan.json")); assert p["kind"] == "soc_scenario_intent_only" and p["execution_evidence"] is None'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-plan-intent-only
          path: .tools/scenarios/smoke/scenario-plan.json
          if-no-files-found: ignore
