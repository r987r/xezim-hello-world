name: SCN-3 SystemVerilog scenario contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/scenario_sv.py'
      - 'tools/scenario_sv_workspace.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'tests/test_scenario_sv.py'
      - 'dv/common/test_scenario_sv_adapter.sv'
      - 'docs/scenario-sv-contract.md'
      - '.github/workflows/dv-scenario-sv.yml'
      - 'dv/common/scenario.py'
      - 'tools/scenario_plan.py'
      - 'config/scenarios/**'
      - 'config/soc.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scn3-sv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sv-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simple contract tools (no full NoC build)
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          sudo apt-get update -qq
          sudo apt-get install -y verilator
      - name: 'Unit tests: fail-closed SV and scenario ABI'
        run: python3 -m unittest tests.test_scenario_sv tests.test_scenario_plan -v
      - name: Compile, execute and audit existing Scenario SV driver contract
        id: native
        run: python3 tools/scenario_sv_workspace.py
      - uses: actions/upload-artifact@v4
        with:
          name: scn3-sv-contract-native-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native.outputs.run_dir }}/**
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && steps.native.outputs.run_dir != ''
        with:
          name: scn3-sv-contract-diagnostics-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native.outputs.run_dir }}/**
          include-hidden-files: true
          if-no-files-found: error
