name: Ethernet RX real AXI DMA and SRAM readback
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/ethernet_rx_dma.v'
      - 'dv/ethernet0/rx_dma_tb.v'
      - '.github/workflows/ethernet-rx-dma.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ethernet-rx-dma
  cancel-in-progress: true
jobs:
  rx-dma:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
      - name: Fetch exact locked, unmodified verilog-axi modules
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 tools/ip_fetch.py verilog_axi
      - name: Compile and execute real RTL DMA into upstream SRAM
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s ethernet_rx_dma_tb -o /tmp/eth_rx_dma_tb \
            rtl/io/ethernet0/ethernet_rx_dma.v \
            dv/ethernet0/rx_dma_tb.v \
            .tools/verilog_axi/rtl/axi_dma_wr.v \
            .tools/verilog_axi/rtl/axi_ram.v
          vvp /tmp/eth_rx_dma_tb
