name: Regenerate FlooNoC RTL on feature branch

on:
  push:
    branches: [feat/checked-in-floonoc-rtl-20261102]
    paths:
      - 'config/interface_contracts.yaml'
      - 'tools/floonoc_gen.py'
      - 'tools/interface_contracts.py'
      - 'tests/**'
      - '.github/workflows/regen-floonoc-feature.yml'

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned FlooGen
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Regenerate native FlooNoC depth parameter and all manifests
        run: |
          set -euo pipefail
          make gen
          make check-generated
          make check-config
      - name: Commit reproducible generated Verilog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gen README.md
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate FlooNoC RTL for explicit per-ID transaction FIFO depth"
            git push
          fi
