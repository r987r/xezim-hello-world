name: Ethernet integrated queue-descriptor-AXI write SRAM
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/ethernet_rx_queue_engine.v'
      - 'rtl/io/ethernet0/ethernet_queue_ctrl.sv'
      - 'rtl/io/ethernet0/ethernet_rx_desc_fetch.v'
      - 'rtl/io/ethernet0/ethernet_rx_dma.v'
      - 'rtl/io/ethernet0/ethernet_cq_axi_writer.v'
      - 'dv/ethernet0/rx_queue_engine_tb.v'
      - 'tools/ethernet_unit_workspace.py'
      - 'tools/ethernet_frame_workspace.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'tests/test_ethernet_unit_workspace.py'
      - 'config/ip.lock.yaml'
      - 'tools/ip_fetch.py'
      - '.github/workflows/ethernet-rx-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ethernet-integrated-queue
  cancel-in-progress: true
jobs:
  queue-dma:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
      - name: Fetch exact pinned upstream AXI DMA and SRAM RTL
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 tools/ip_fetch.py verilog_axi
      - name: Check archive source and transcript custody
        run: python3 -m unittest tests.test_ethernet_unit_workspace -v
      - name: Elaborate and simulate RTL queue, descriptor, SRAM DMA and CQ gate
        id: native-unit
        run: python3 tools/ethernet_unit_workspace.py rx-queue
      - name: Archive original isolated RTL unit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-rx-queue-native-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-unit.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Archive failed RTL unit diagnostics separately
        if: failure() && steps.native-unit.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-rx-queue-diagnostics-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-unit.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: warn
