name: Regenerate checked-in FlooNoC RTL on feature branch

on:
  push:
    branches:
      - feat/checked-in-floonoc-rtl-20261102
    paths:
      - 'config/**'
      - 'tests/**'
      - 'tools/floonoc_gen.py'
      - 'tools/generate.py'
      - 'tools/interface_contracts.py'
      - '.github/workflows/regen-floonoc-rtl-feature.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream FlooGen
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
      - name: Generate actual upstream FlooNoC Verilog and all SoC artifacts
        run: |
          set -euo pipefail
          make gen
          make check-generated
          make check-config
          test -s gen/noc/floonoc/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("gen/noc/floonoc")
          result=json.loads((root/"manifest.json").read_text())
          assert len(result["networks"]) == 8, result
          for name, p in result["networks"].items():
              assert (root/p["top"]).is_file(),name
              assert (root/p["package"]).is_file(),name
          print("PASS: eight structural FlooNoC RTL packages and tops")
          PY
      - name: Commit real generated RTL, diagrams and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gen README.md
          if ! git diff --cached --quiet; then
            git commit -m "Check in all generated FlooNoC Verilog and regenerated diagrams"
            git push
          fi
