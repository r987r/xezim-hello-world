name: Ethernet real frame staging and header-tap RTL
on:
  pull_request:
    branches: [main]
    paths:
      - 'rtl/io/ethernet0/**'
      - 'dv/ethernet0/rx_frame_stager_tb.v'
      - 'dv/ethernet0/run_mac_gmii.py'
      - 'tools/ethernet_frame_workspace.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'tests/test_ethernet_frame_workspace.py'
      - '.github/workflows/ethernet-frame-stager.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ethernet-stager-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  stager:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus and Python YAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python3 -m pip install 'PyYAML==6.0.3'
      - name: Fetch both exact pinned MAC/AXIS upstream RTL revisions
        run: python3 -c 'from dv.ethernet0.run_mac_gmii import fetch_pinned; fetch_pinned()'
      - name: Verify archive provenance and original marker contract
        run: python3 -m unittest tests.test_ethernet_frame_workspace -v
      - name: Execute real packet buffering and non-destructive header parser
        id: native-stager
        run: python3 tools/ethernet_frame_workspace.py
      - name: Archive original frame-stager transcripts and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-frame-stager-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-stager.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Archive failed frame-stager diagnostics separately
        if: failure() && steps.native-stager.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ethernet-frame-stager-diagnostics-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ steps.native-stager.outputs.run_dir }}
          include-hidden-files: true
          if-no-files-found: warn
