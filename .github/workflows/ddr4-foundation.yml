name: DDR4 verified generation foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rtl/memory/ddr4/**'
      - '.github/workflows/ddr4-foundation.yml'
      - 'tests/test_axi_monitor_lifecycle.py'
  workflow_dispatch:

concurrency:
  # Only one DDR4 validation for a PR head. Old queued/in-progress revisions
  # must not consume runner time or obscure the latest capture evidence.
  group: ddr4-bringup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@v4

      - name: Setup Python for upstream LiteDRAM
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install configuration parser and run local DDR contract tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 -m unittest discover -s rtl/memory/ddr4 -p 'test_*.py' -v
          python3 rtl/memory/ddr4/bringup.py check
          python3 -m unittest discover -s tests -p "test_axi_monitor_lifecycle.py" -v

      - name: Fetch pinned LiteX and LiteDRAM generator dependencies
        run: |
          set -euo pipefail
          python3 tools/ip_fetch.py litedram
          # PyPI litex==2024.12 cannot satisfy this 2026 LiteDRAM pin:
          # litedram/gen.py imports SoCCore from litex.soc.integration.soc.
          # Use the reviewed immutable LiteX source instead; do not patch IP.
          python3 - <<'PY'
          import pathlib, re, subprocess, yaml
          pin = yaml.safe_load(pathlib.Path("rtl/memory/ddr4/toolchain.lock.yml").read_text())["litex"]
          assert re.fullmatch(r"[0-9a-f]{40}", pin["commit"])
          dest = pathlib.Path(".tools/litex")
          dest.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(["git", "init", "-q", str(dest)], check=True)
          subprocess.run(["git", "-C", str(dest), "remote", "add", "origin", pin["git"]], check=True)
          subprocess.run(["git", "-C", str(dest), "fetch", "-q", "--depth", "1", "origin", pin["commit"]], check=True)
          subprocess.run(["git", "-C", str(dest), "checkout", "-q", "--detach", pin["commit"]], check=True)
          sha = subprocess.check_output(["git", "-C", str(dest), "rev-parse", "HEAD"], text=True).strip()
          assert sha == pin["commit"], (sha, pin["commit"])
          print("LiteX pinned SHA:", sha)
          PY
          python3 -m pip install --disable-pip-version-check -e .tools/litex
          python3 -m pip install --disable-pip-version-check --no-deps -e .tools/litedram
          # LiteX's SimPlatform Verilog exporter unconditionally resolves TAPCFG data.
          # The PyPI release is immutable; do not patch LiteX to bypass imports.
          python3 -m pip install --disable-pip-version-check 'pythondata-misc-tapcfg==0.0.post517'
          python3 - <<'PY'
          from litex.soc.integration.soc import SoCCore
          from litex.soc.integration.builder import Builder
          from litedram import gen
          import importlib.metadata as meta
          print("Verified generator prerequisites:", SoCCore, Builder, gen.LiteDRAMCore)
          print("litex:", meta.version("litex"), "litedram:", meta.version("litedram"))
          PY
          mkdir -p .tools/ddr4
          python3 -m pip freeze > .tools/ddr4/dependency_versions.txt
          git -C .tools/litedram rev-parse HEAD

      - name: Generate DDR4 controller and DFI simulation model
        run: |
          set -euo pipefail
          python3 rtl/memory/ddr4/bringup.py generate
          test -s .tools/ddr4/litedram_sim/ddr4_manifest.json
          test -s .tools/ddr4/litedram_sim/ddr4_init_plan.json
          ls -lh .tools/ddr4/litedram_sim/gateware/

      - name: Check real generated LiteDRAM AXI pins against DDR-B SoC contract
        run: |
          set -euo pipefail
          python3 rtl/memory/ddr4/soc_bridge_contract.py \
            --generated-verilog .tools/ddr4/litedram_sim/gateware/soc_ddr4_sim.v \
            --output .tools/ddr4/ddr_soc_bridge_contract.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.tools/ddr4/ddr_soc_bridge_contract.json')
          j=json.loads(p.read_text())
          assert j['integration_state']=='contract_only'
          assert j['implementation']['controller_data_bits']==64
          assert j['implementation']['fabric_addr_bits']==64
          assert j['implementation']['modeled_size']==32*1024*1024
          print('DDR-B generated LiteDRAM pin/SoC contract PASS (not full-chip RTL)')
          PY
      - name: Validate planned DDR-B Config NoC init mapping against actual generated LiteDRAM CSR
        run: |
          set -euo pipefail
          python3 rtl/memory/ddr4/config_noc_init_contract.py \
            --soc config/soc.yaml \
            --plan .tools/ddr4/litedram_sim/ddr4_init_plan.json \
            --csr .tools/ddr4/litedram_sim/csr.json \
            --generated-verilog .tools/ddr4/litedram_sim/gateware/soc_ddr4_sim.v \
            --output .tools/ddr4/litedram_sim/ddr4_config_noc_init_contract.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(".tools/ddr4/litedram_sim/ddr4_config_noc_init_contract.json").read_text())
          assert d["status"]=="contract_only_not_driven_in_full_chip"
          assert d["requires_hardware_translator"] is True
          assert d["config_base"]==0x40030000
          assert d["actions"][-2]["csr"]=="ddrctrl_init_error"
          assert d["actions"][-2]["expect_value"]==0
          print("DDR-B Config NoC init address/CSR pin contract passed, hardware bridge unconnected")
          PY

      - name: Install Verilator for isolated RTL check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y verilator

      - name: Simulate isolated DDR-B physical-address aperture guard RTL
        run: |
          set -euo pipefail
          verilator --binary --timing --assert -Wno-fatal \
            --top-module tb_ddr_litedram_aperture_guard \
            --Mdir .tools/ddr4/guard_sim \
            rtl/memory/ddr4/soc_aperture_guard.sv \
            rtl/memory/ddr4/tb_soc_aperture_guard.sv
          .tools/ddr4/guard_sim/Vtb_ddr_litedram_aperture_guard

      - name: Simulate DDR-B bounded AXI bridge and response protocol
        run: |
          set -euo pipefail
          verilator --binary --timing --assert -Wno-fatal \
            --top-module tb_ddr_litedram_axi_bridge \
            --Mdir .tools/ddr4/bridge_sim \
            rtl/memory/ddr4/soc_aperture_guard.sv \
            rtl/memory/ddr4/soc_axi_bridge.sv \
            rtl/memory/ddr4/tb_soc_axi_bridge.sv
          .tools/ddr4/bridge_sim/Vtb_ddr_litedram_axi_bridge

      - name: Lint actual generated DDR4 RTL
        run: python3 rtl/memory/ddr4/check_rtl.py --tool verilator --timeout 600

      - name: Install upstream Cocotb AXI test framework
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cocotb==1.9.2' 'cocotbext-axi==0.1.28' 'cocotb-test==0.2.6'
          python3 - <<'PY'
          import cocotb
          import importlib.metadata as metadata
          from cocotbext.axi import AxiMaster
          from cocotb_test.simulator import run
          assert metadata.version('cocotbext-axi') == '0.1.28'
          print('Cocotb', cocotb.__version__, 'cocotbext-axi', metadata.version('cocotbext-axi'))
          PY

      - name: Run real DDR4 Wishbone init and AXI traffic with continuous capture
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python3 rtl/memory/ddr4/run_functional.py

      - name: Verify DDR4 standalone HTML report (measured vs unmeasured)
        run: |
          set -euo pipefail
          python3 rtl/memory/ddr4/report_html.py --dir .tools/ddr4/litedram_sim
          test -s .tools/ddr4/litedram_sim/ddr4-report.html
          grep -q 'UNMEASURED' .tools/ddr4/litedram_sim/ddr4-report.html

      - name: Check all-simulation AXI/Wishbone monitor evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'rtl/memory/ddr4')
          from traffic_observer import verify_capture
          report = verify_capture(Path('.tools/ddr4/litedram_sim'))
          print('DDR4 monitor PASS:', report['sampled_cycles'], 'cycles,', report['channels'])
          PY

      - name: Upload generated RTL, initialization plan and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddr4-foundation-generated-rtl
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            .tools/ddr4/
