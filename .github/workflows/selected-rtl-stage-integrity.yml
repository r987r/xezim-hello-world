name: Selected RTL stage metadata integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/stage_selected_rtl.py'
      - 'tests/test_stage_selected_rtl.py'
      - 'docs/selected-rtl-staging.md'
      - '.github/workflows/selected-rtl-stage-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: python3 -m unittest tests.test_stage_selected_rtl tests.test_selected_rtl_archive -v
      - run: python3 -m py_compile tools/stage_selected_rtl.py
