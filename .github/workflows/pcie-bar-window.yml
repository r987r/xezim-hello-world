name: PCIe BAR0 complete-span protection
on:
  pull_request:
    branches: [main]
    paths:
      - 'dv/pcie_link/bar0_noc_translate.sv'
      - 'dv/pcie_link/tb_bar0_noc_translate.sv'
      - 'tools/pcie_prelink_workspace.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'tests/test_pcie_prelink_workspace.py'
      - 'requirements.txt'
      - '.github/workflows/pcie-bar-window.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  complete-span:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-10'
          github-token: ${{ github.token }}
      - name: Verify PCIe unit transcript workspace contract
        run: python3 -m unittest tests.test_pcie_prelink_workspace tests.test_test_identity -v
      - name: Real RTL simulation of BAR0 bounds and rejection
        id: native
        run: |
          set -euo pipefail
          iverilog -V | head -n 2
          python3 tools/pcie_prelink_workspace.py bar0-complete-span
      - name: Archive actual simulator transcripts and source provenance
        if: always() && steps.native.outputs.execution_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: pcie-bar0-complete-span-${{ github.run_id }}-a${{ github.run_attempt }}
          path: '.tools/runs/*/pcie-bar-window-default/bar0-complete-span/${{ steps.native.outputs.execution_id }}/'
          include-hidden-files: true
          if-no-files-found: error
