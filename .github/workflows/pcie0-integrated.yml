name: PCIe0 integrated real bridge and generated local FlooNoC

on:
  pull_request:
    branches: [main]
    paths: ['dv/pcie0/**', 'tests/test_pcie*', 'tests/test_protocol_report.py', 'tools/protocol_report.py', 'tools/pcie_latency_report.py', 'tools/axi_report.py', 'tools/regress.py', 'tools/full_chip_gen.py', 'tools/chip_bootgen.py', 'tools/pcie_chip.py', 'tools/cpu_dma_firmware.py', 'config/regression.yaml', 'sw/common/test_flow.h', 'sw/dma/tests/cpu_dma_run.c', 'tests/test_test_flow*', 'tools/test_flow*', '.github/workflows/pcie0-integrated.yml']
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: pcie0-integrated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pcie0-real-noc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alexforencich/verilog-pcie
          ref: 25156a9a162c41c60f11f41590c7d006d015ae5a
          path: .tools/verilog_pcie
          persist-credentials: false
      - uses: ./.github/actions/setup-bender
        env: {GH_TOKEN: "${{ github.token }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned IP and verification dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install 'mako==1.3.10' 'hjson==3.1.0' 'peakrdl>=1.5.0' 'peakrdl-rawheader>=0.2.8' 'peakrdl-cheader>=1.1.0'
          python3 tools/ip_fetch.py floonoc picorv32 serv wb2axip verilog_axi pulp_idma
          python3 -m pip install -e .tools/floonoc
          python3 -m pip install 'cocotb==1.9.2' 'cocotb-bus==0.2.1' 'cocotbext-pcie==0.2.14' 'cocotbext-axi==0.1.24'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator iverilog clang llvm lld
      - name: Validate real RTL pins, test contracts and generated endpoints
        run: |
          python3 dv/pcie0/run_rtl_smoke.py --check-pin
          python3 -m unittest tests.test_pcie_bar_contract tests.test_pcie_diagnostic_contract tests.test_test_flow tests.test_test_flow_cross_source tests.test_pcie_tlp_trace tests.test_pcie_latency_report tests.test_protocol_report tests.test_cpu_dma_firmware -v
          python3 dv/pcie0/prepare_rtl.py
          python3 tools/regress.py --check-noc
          make check-generated
      - name: PCIe TLP -> PCIe0 FlooNoC -> real PULP SRAM
        run: python3 dv/pcie0/run_noc_smoke.py
      - name: Real CPU iDMA DDR-model exchange with host PCIe BAR readback
        run: |
          python3 -m unittest tests.test_pcie_host_phase -v
          python3 tools/regress.py chip-pcie-host
      - name: Preserve canonical PCIe results, Cocotb XML and transaction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcie0-dedicated-noc-${{ github.run_id }}
          # Preserve result/protocol/AXI/flow provenance, not 1+ GiB of
          # reproducible Verilator object files and precompiled headers.
          path: .tools/regression/chip-pcie-host/
          include-hidden-files: true
          if-no-files-found: warn

  cpu-c-same-flow:
    name: CPU C/iDMA -- same INIT RUN CHECK step reports
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bender
        env: {GH_TOKEN: "${{ github.token }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install existing chip-C firmware and NoC IP dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install 'mako==1.3.10' 'hjson==3.1.0' 'peakrdl>=1.5.0' 'peakrdl-rawheader>=0.2.8' 'peakrdl-cheader>=1.1.0'
          python3 tools/ip_fetch.py floonoc pulp_idma
          python3 -m pip install -e .tools/floonoc
          python3 -m pip install 'cocotb==1.9.2' 'cocotbext-axi==0.1.24'
          sudo apt-get update -qq
          sudo apt-get install -y verilator clang llvm lld
      - name: Verify generated files and C step ABI before RTL
        run: |
          make check-generated
          python3 -m unittest tests.test_test_flow tests.test_test_flow_cross_source tests.test_cpu_dma_firmware -v
      - name: Run actual CPU C and dual-DMA test using shared phase-flow reporter
        run: python3 tools/regress.py chip-cpu-dma
      - name: Retain real C firmware and AXI/step evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-c-init-run-check-flow-${{ github.run_id }}
          path: .tools/regression/chip-cpu-dma/
          include-hidden-files: true
          if-no-files-found: warn
