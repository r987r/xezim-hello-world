# Temporary in-branch regeneration gate while PR #14 changes generated SoC
# connectivity. Only trusted pushes to this exact same-repository branch
# receive write permissions; pull_request and fork code never run here.
name: Synchronize generated SoC DMA RTL for PR 14
on:
  push:
    branches: [feature/dma-dv-descriptor-foundation]
    paths:
      - 'tools/full_chip_gen.py'
      - 'tools/noc_diagrams.py'
      - 'tools/generate.py'
      - 'config/soc.yaml'
      - '.github/workflows/refresh-dma-gen.yml'
permissions:
  contents: write
concurrency:
  group: refresh-dma-gen
  cancel-in-progress: true
jobs:
  regenerate:
    if: github.repository == 'r987r/xezim-hello-world'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
          make gen
          make check-generated
      - name: Commit only source-derived RTL, manifests and README diagram
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A gen README.md
          if git diff --cached --quiet; then
            echo 'Generation already synchronized'
          else
            git commit -m 'chore(gen): synchronize SoC DMA wiring from YAML'
            git push origin HEAD:feature/dma-dv-descriptor-foundation
          fi
