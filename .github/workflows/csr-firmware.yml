name: Generated CSR firmware ABI

on:
  pull_request:
    branches: [main]
    paths:
      - 'csr/rdl/soc_dma_shim.rdl'
      - 'csr/generated/soc_dma_shim.json'
      - 'sw/generated/soc_dma_shim_regs.h'
      - 'sw/dma/**'
      - 'tools/csr_dma_header.py'
      - 'tools/cpu_dma_firmware.py'
      - '.github/workflows/csr-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-csr:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned RDL compiler and RV32I tools
        run: |
          python3 -m pip install 'PyYAML==6.0.3' -r csr/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm lld
      - name: Check generated C offsets, masks and exact RTL ABI
        run: |
          python3 tools/csr_dma_header.py --check
          python3 -m unittest tests.test_dma_sw tests.test_cpu_dma_firmware tests.test_rv32i_runtime -v
      - name: Compile actual C runtime driver with generated header
        run: |
          clang --target=riscv32-unknown-elf -march=rv32i -mabi=ilp32 -std=c11 -Wall -Wextra -Werror -Oz -ffreestanding -ffunction-sections -fdata-sections -c sw/dma/dma.c -o /tmp/soc_dma_generated.o
      - name: Build actual CPU C DMA ELF and verify size
        run: |
          python3 -m tools.cpu_dma_firmware --out .tools/csr-fw-probe
          test -s .tools/csr-fw-probe/cpu_dma.elf
          test -s .tools/csr-fw-probe/cpu_dma.bin
          llvm-size .tools/csr-fw-probe/cpu_dma.elf
