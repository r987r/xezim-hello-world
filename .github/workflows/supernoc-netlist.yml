name: CONNECT actual SuperNoC elaborated boundary edges

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supernoc-netlist.yml'
      - '.github/workflows/real-netlist.yml'
      - 'tools/supernoc_netlist_contract.py'
      - 'tools/supernoc_netlist_negative.py'
      - 'tools/signal_paths.py'
      - 'tools/design_netlist.py'
      - 'tools/selected_rtl_provenance.py'
      - 'tests/test_supernoc_netlist_contract.py'
      - 'gen/supernoc/**'
      - 'config/regression.yaml'
      - 'Bender.yml'
      - 'Bender.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-supernoc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborated-supernoc:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate contract rejection logic before actual RTL export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
          python3 -m unittest tests.test_supernoc_netlist_contract tests.test_signal_paths -v
      - name: Resolve selected generated SuperNoC filelist and identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/regress.py supernoc --stage files
          test -s .tools/regression/supernoc/sources.f
          test -s .tools/regression/supernoc/plan.json
          test -s gen/supernoc/supernoc_tb.sv
          test -s gen/supernoc/soc_noc.sv
      - name: Build pinned Slang Netlist exporter
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/jameshanlon/slang-netlist.git .tools/slang-netlist-source
          git -C .tools/slang-netlist-source checkout --detach 650cd5c76645c27697a61c11db98f2f6d969ad1a
          test "$(git -C .tools/slang-netlist-source rev-parse HEAD)" = "650cd5c76645c27697a61c11db98f2f6d969ad1a"
          cmake -S .tools/slang-netlist-source -B .tools/slang-netlist-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF -DENABLE_PY_BINDINGS=OFF
          cmake --build .tools/slang-netlist-build -j 2 --target slang-netlist
          test -x .tools/slang-netlist-build/tools/driver/slang-netlist
      - name: Elaborate exact SuperNoC and prove every wrapper binding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/design_netlist.py \
            --profile supernoc --mode netlist \
            --slang-netlist "$PWD/.tools/slang-netlist-build/tools/driver/slang-netlist" \
            --output .tools/connect46/supernoc-netlist.json
          python3 tools/supernoc_netlist_contract.py \
            --netlist .tools/connect46/supernoc-netlist.json \
            --meta .tools/connect46/supernoc-netlist.json.meta.json \
            --out .tools/connect46/supernoc-ports-proof.json
          python3 tools/supernoc_netlist_negative.py \
            --netlist .tools/connect46/supernoc-netlist.json \
            --meta .tools/connect46/supernoc-netlist.json.meta.json \
            --out .tools/connect46/supernoc-negative-proof.json
      - name: Preserve real source-selected original proof or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect46-supernoc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/connect46/supernoc-*
            .tools/regression/supernoc/plan.json
            .tools/regression/supernoc/sources.f
            .tools/regression/supernoc/identity.json
          include-hidden-files: true
          if-no-files-found: warn
