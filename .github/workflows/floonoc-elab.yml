name: FlooNoC structural RTL compile and elaborate

on:
  push:
    paths:
      - 'gen/noc/floonoc/**'
      - 'tools/floonoc_gen.py'
      - '.github/workflows/floonoc-elab.yml'
  pull_request:
    paths:
      - 'gen/noc/floonoc/**'
      - 'tools/floonoc_gen.py'
      - '.github/workflows/floonoc-elab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elaborate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked FlooNoC source and upstream Bender dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          mkdir -p .tools/bin
          gh release download v0.32.1 --repo pulp-platform/bender \
            --pattern 'bender-x86_64-unknown-linux-gnu.tar.xz' \
            --pattern 'bender-x86_64-unknown-linux-gnu.tar.xz.sha256' --dir .tools/bin
          (cd .tools/bin && sha256sum -c bender-x86_64-unknown-linux-gnu.tar.xz.sha256)
          tar -xJf .tools/bin/bender-x86_64-unknown-linux-gnu.tar.xz -C .tools/bin
          echo "Bender archive contents:"
          tar -tf .tools/bin/bender-x86_64-unknown-linux-gnu.tar.xz
          candidate="$(find .tools/bin -maxdepth 4 -type f -name 'bender*' ! -name '*.tar.xz*' -print -quit)"
          if [ -z "$candidate" ]; then
            echo "Bender executable not found in archive" >&2
            exit 1
          fi
          if [ "$candidate" != ".tools/bin/bender" ]; then
            cp "$candidate" .tools/bin/bender
          fi
          chmod +x .tools/bin/bender
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve pinned upstream FlooNoC compile filelist
        run: |
          set -euo pipefail
          cd .tools/floonoc
          bender --version
          bender checkout
          bender script flist -t rtl -t cc_no_deprecated > "$GITHUB_WORKSPACE/.tools/floonoc-rtl.f"
          test -s "$GITHUB_WORKSPACE/.tools/floonoc-rtl.f"
          echo "Upstream Bender include directories and packages:"
          grep -E 'incdir|floo_pkg|axi_pkg' "$GITHUB_WORKSPACE/.tools/floonoc-rtl.f" | head -n 35 || true
          # tech_cells_generic pad_functional contains legacy switch-level
          # MOSFET primitives unsupported by Verilator and unrelated to the
          # NoC. We exclude only that unreachable vendor-pad simulation cell.
          # The upstream Bender.lock resolves the whole SoC dependency graph,
          # including iDMA, APB, OBI and FPnew. Those are NOT part of a
          # standalone router/chimney elaboration, so compile only the pinned
          # FlooNoC/AXI/common_cells/tech_cells source subset.
          grep -Ev '/(idma|fpnew|fpu_div_sqrt_mvp|register_interface|obi|axi_stream|apb|common_verification)-[^/]+/|/src/deprecated/pad_functional[.]sv' \
            "$GITHUB_WORKSPACE/.tools/floonoc-rtl.f" > "$GITHUB_WORKSPACE/.tools/floonoc-lint.f"
          echo "NoC dependency filelist lines: $(wc -l < "$GITHUB_WORKSPACE/.tools/floonoc-lint.f")"
      - name: Install Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y verilator
          verilator --version
      - name: Elaborate all eight upstream-generated local/global NoC RTL modules
        run: |
          set -euo pipefail
          includes=()
          for d in .tools/floonoc/.bender/git/checkouts/*/include; do
            [ -d "$d" ] && includes+=("-I$d")
          done
          includes+=("-I.tools/floonoc/hw/include")
          python3 - <<'PY' > .tools/noc-toplist.tsv
          import json
          from pathlib import Path
          root = Path("gen/noc/floonoc")
          networks=json.loads((root/"manifest.json").read_text())["networks"]
          for name, network in sorted(networks.items()):
              print("\t".join((network["top_module"],
                    str(root/network["package"]), str(root/network["top"]))))
          PY
          count=0
          while IFS=
\t' read -r top pkg rtl; do
            echo "ELABORATE $top from $rtl"
            verilator --lint-only --timing --top-module "$top" \
              -Wno-fatal "${includes[@]}" \
              -f .tools/floonoc-lint.f "$pkg" "$rtl"
            count=$((count+1))
          done < .tools/noc-toplist.tsv
          test "$count" -eq 8
          echo "PASS: elaborated $count real upstream FlooNoC networks"

