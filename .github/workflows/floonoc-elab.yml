name: FlooNoC structural RTL compile and elaborate

on:
  pull_request:
    branches: [main]
    paths:
      - 'gen/noc/floonoc/**'
      - 'tools/floonoc_gen.py'
      - 'tools/supernoc_gen.py'
      - 'gen/supernoc/**'
      - 'Bender.yml'
      - 'Bender.lock'
      - '.github/actions/setup-bender/**'
      - 'tools/regress.py'
      - 'tools/sim_cocotb.py'
      - 'tools/axi_report.py'
      - 'tools/memory_service.py'
      - 'tools/memory_report.py'
      - 'tools/memory_plan.py'
      # Refresh RTL traffic evidence when its fabric reporting contract changes.
      - 'tools/fabric_report.py'
      - 'tools/templates/run_report.html'
      - 'dv/common/axi_trace.py'
      - 'dv/supernoc/**'
      - 'tests/test_supernoc_gen.py'
      - 'config/soc.yaml'
      - 'config/regression.yaml'
      - 'config/interface_contracts.yaml'
      - 'config/ip.lock.yaml'
      - 'config/examples/**'
      - '.github/workflows/floonoc-elab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floonoc-elab-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bender
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install configuration and pinned upstream RTL dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 tools/ip_fetch.py floonoc
          python3 -m pip install -e .tools/floonoc
          python3 -m pip install 'cocotb==1.9.2' 'cocotbext-axi==0.1.24'
          sudo apt-get update -qq
          sudo apt-get install -y verilator
          verilator --version
      - name: Verify generated artifacts and configured native NoC contracts
        run: |
          make check-generated
          python3 tools/regress.py --check-noc
      - name: Run YAML-defined Verilator elaboration, connected traffic and named corruption check
        run: python3 tools/regress.py noc
      - name: Retain resolved NoC filelists, plans, logs and cocotb XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supernoc-real-axi-traffic
          path: |
            .tools/regression/
            gen/supernoc/manifest.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish AXI run explorer pages and transaction data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supernoc-axi-run-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/regression/supernoc*/report.html
            .tools/regression/supernoc*/axi-*.json*
            .tools/regression/supernoc*/memory-operations.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Download the checksum-verified pinned Xezim release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source toolchains/xezim.env
          gh release download "$XEZIM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$XEZIM_ASSET_NAME" \
            --pattern "$XEZIM_ASSET_NAME.sha256" --dir .tools/bin
          (cd .tools/bin && sha256sum -c "$XEZIM_ASSET_NAME.sha256")
          chmod +x ".tools/bin/$XEZIM_ASSET_NAME"
          echo "XEZIM_BIN=$GITHUB_WORKSPACE/.tools/bin/$XEZIM_ASSET_NAME" >> "$GITHUB_ENV"
      - name: Xezim structural compatibility probe (not a traffic result)
        continue-on-error: true
        timeout-minutes: 10
        run: python3 tools/regress.py compatibility
      - name: Preserve Xezim diagnostics for simulator comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xezim-floonoc-compile-probe
          path: .tools/regression/noc-xezim/
          include-hidden-files: true
          if-no-files-found: ignore
