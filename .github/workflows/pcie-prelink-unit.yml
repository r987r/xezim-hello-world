name: PCIe device prelink, host BAR0, PHY response RTL
on:
  pull_request:
    branches: [main]
    paths:
      - 'dv/pcie_link/endpoint_prelink_ctrl.sv'
      - 'dv/pcie_link/tb_endpoint_prelink_ctrl.sv'
      - 'dv/pcie_link/phy_status_responder.sv'
      - 'dv/pcie_link/tb_phy_status_responder.sv'
      - 'dv/pcie_link/pcie_bar0_host_cfg.sv'
      - 'dv/pcie_link/tb_pcie_bar0_host_cfg.sv'
      - 'tools/pcie_prelink_workspace.py'
      - 'tools/run_workspace.py'
      - 'tools/test_identity.py'
      - 'tests/test_pcie_prelink_workspace.py'
      - 'requirements.txt'
      - '.github/workflows/pcie-prelink-unit.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  run-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        lane: [device-prelink, host-bar0, phy-response]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-10'
          github-token: ${{ github.token }}
      - name: Verify prelink workspace contract
        if: matrix.lane == 'device-prelink'
        run: python3 -m unittest tests.test_pcie_prelink_workspace tests.test_test_identity -v
      - name: Execute unchanged original Icarus unit lane
        id: native
        run: python3 tools/pcie_prelink_workspace.py ${{ matrix.lane }}
      - name: Publish only original transcripts and source provenance
        if: always() && steps.native.outputs.execution_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: pcie-prelink-${{ matrix.lane }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: '.tools/runs/*/pcie-prelink-default/${{ matrix.lane }}/${{ steps.native.outputs.execution_id }}/'
          include-hidden-files: true
          if-no-files-found: error
