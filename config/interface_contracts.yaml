# Architectural interface-sizing contract, *not* an RTL implementation.
# config/soc.yaml is authoritative for subsystems, buses, fabrics and addresses.
# This file defines reusable throughput/queue-depth targets and per-instance
# overrides, independently validated against real FlooGen and memory RTL.
schema_version: 1

# Independent read and write budgets. These are acceptance targets until the
# corresponding IP is actually emitted; a YAML value alone does not enforce it.
defaults:
  axi4:
    max_pending_reads: 4
    max_pending_writes: 4
    max_burst_beats: 16
  axi4_lite:
    max_pending_reads: 1
    max_pending_writes: 1
    max_burst_beats: 1

# Native parameter names from pinned upstream PULP AXI/FlooNoC/Verilog-AXI.
# Important: PULP MaxMstTrans/MaxSlvTrans and Floo MaxTxns are SHARED
# transaction resources, not independent AR/AW hardware limits.
# Until upstream emitters exist, these are validated planned values.
fabric_parameters:
  local_data: &local_data_floo
    MaxTxns: 8
    # Pinned upstream floo_rob_status_table fifo_usage_t is clog2(Depth).
    # Use non-power-of-two per-ID FIFO depth >= aggregate outstanding cap:
    # Depth=8 misconnects cc_fifo usage width (4) to $clog2(8)=3.
    # Depth=9 uses the correct 4-bit usage width without forking RTL.
    MaxTxnsPerId: 9
    MaxUniqueIds: 4
    # No AXI atomics in this SoC: preserve existing unique non-atomic ID
    # capacity without consuming a destination ID for atomic reservations.
    AtopSupport: false
    MaxAtomicTxns: 0
    RRoBType: NormalRoB
    BRoBType: NormalRoB
    RRoBSize: 8
    BRoBSize: 8
  local_config: &config_floo
    MaxTxns: 2
    MaxTxnsPerId: 3
    # One-bit control ID allows two unique non-atomic IDs when the unused
    # atomic reservation is disabled explicitly in native FlooNoC params.
    MaxUniqueIds: 2
    AtopSupport: false
    MaxAtomicTxns: 0
    RRoBType: NoRoB
    BRoBType: NoRoB
    RRoBSize: 2
    BRoBSize: 2
  memory_data:
    S_THREADS: 2
    S_ACCEPT: 16
    M_ISSUE: 4
  global_data:
    MaxTxns: 8
    # Pinned upstream floo_rob_status_table fifo_usage_t is clog2(Depth).
    # Use non-power-of-two per-ID FIFO depth >= aggregate outstanding cap:
    # Depth=8 misconnects cc_fifo usage width (4) to $clog2(8)=3.
    # Depth=9 uses the correct 4-bit usage width without forking RTL.
    MaxTxnsPerId: 9
    MaxUniqueIds: 4
    # No AXI atomics in this SoC: preserve existing unique non-atomic ID
    # capacity without consuming a destination ID for atomic reservations.
    AtopSupport: false
    MaxAtomicTxns: 0
    RRoBType: NormalRoB
    # Mitigate observed response-ID underflow at inter-NoC boundary:
    # concurrent AWID=1 writes to Ethernet SRAM and Memory0 returned
    # completions out of order; a B arrived as ID=0 with no ID=0 AW pending.
    # Pinned upstream NoRoB permits parallel different IDs but holds a
    # given ID to one destination until its prior responses complete.
    BRoBType: NoRoB
    RRoBSize: 8
    BRoBSize: 8
  memory_local_data: *local_data_floo
  global_config: *config_floo

# Resolved after type defaults, before per-port overrides. Unknown instances
# and names are errors, not silently ignored.
instance_overrides:
  compute1:
    local_data:
      max_pending_reads: 2
      max_pending_writes: 2

# Per-module/port overrides. Only declared schema ports are legal.
# The CPU-native Wishbone / AXI-Lite interfaces are NOT being presented as
# AXI4: cpu_in refers to the *output of a future verified protocol adapter*.
port_overrides:
  compute0.local_data.cpu_in: {max_pending_reads: 1, max_pending_writes: 1}
  compute1.local_data.cpu_in: {max_pending_reads: 1, max_pending_writes: 1}
