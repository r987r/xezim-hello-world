schema_version: 2
name: xezim_soc_dv

# Stable, vendor-neutral interface contracts. Generated adapters match these.
buses:
  data: {protocol: axi4, addr_bits: 64, data_bits: 64, id_bits: 4}
  config: {protocol: axi4_lite, addr_bits: 32, data_bits: 32}

# One DMA implementation reused for both compute subsystems. CPU IPs differ.
subsystem_types:
  compute:
    dma: pulp_idma
    sram_count: 1
    local_data_fabric: local_data
    local_config_fabric: local_config
  memory:
    local_data_fabric: memory_data
    local_config_fabric: local_config
    data_ingress_ports: 2

subsystems:
  - name: compute0
    type: compute
    cpu: {ip: picorv32, bus: axi4_lite, adapter: picorv32_axi}
  - name: compute1
    type: compute
    cpu: {ip: serv, bus: wishbone, adapter: serv_wishbone}
  - {name: memory0, type: memory}

# Architectural topology and backend selection are separate. This allows
# a different vendor's NoC backend without changing subsystem definitions.
fabrics:
  local_data: {topology: crossbar, backend: pulp_axi}
  local_config: {topology: crossbar, backend: pulp_axi}
  memory_data: {topology: crossbar, backend: verilog_axi}
  global_data: {topology: mesh, backend: floonoc}
  global_config: {topology: tree, backend: pulp_axi}

networks:
  global_data:
    protocol: axi4
    # Two global NoC AXI output interfaces into the memory subsystem.
    outputs:
      - {name: memory_ingress0, target: memory0.hbm0}
      - {name: memory_ingress1, target: memory0.ddr0}
  global_config:
    protocol: axi4_lite
    reachable_subsystems: [compute0, compute1, memory0]

# HBM and DDR use different controller profiles, but the same AXI4 port
# contract. AXI RAM is the explicitly *behavioral* backing model used for
# fast Xezim fabric verification, NOT an HBM/DDR physical controller.
memory_targets:
  - name: memory0.hbm0
    kind: hbm
    controller: hisa_hbm
    simulation: {backend: axi_ram, pipeline_output: false}
  - name: memory0.ddr0
    kind: ddr
    controller: litedram
    simulation: {backend: axi_ram, pipeline_output: true}

address_map:
  data:
    - {name: compute0.sram, base: '0x10000000', size: '0x00100000'}
    - {name: compute1.sram, base: '0x11000000', size: '0x00100000'}
    - {name: memory0.hbm0, base: '0x100000000', size: '0x40000000'}
    - {name: memory0.ddr0, base: '0x140000000', size: '0x40000000'}
  config:
    - {name: compute0.dma, base: '0x40000000', size: '0x10000'}
    - {name: compute1.dma, base: '0x40010000', size: '0x10000'}
    - {name: memory0.hbm0, base: '0x50000000', size: '0x10000'}
    - {name: memory0.ddr0, base: '0x50010000', size: '0x10000'}

verification:
  memory:
    ingress_master_agents: 2
    model_address_bits: 16
    burst_beats: 4
