schema_version: 1
# Debug recipes are investigation aids, not qualification gates.
# Keep each recipe's command identical to an existing test/runner invocation.
profiles:
  framework-unit:
    description: Self-check of the shared debug evidence wrapper and manifest.
    command: [python3, -m, unittest, tests.test_debug_repro]
    timeout_s: 60
    tool_versions: [python3]
  regression-unit:
    description: Existing canonical regression framework unit test (not a new test engine).
    command: [python3, -m, unittest, tests.test_regression]
    timeout_s: 180
    tool_versions: [python3]
  chip-pcie-host:
    description: Existing real RTL PCIe host/NoC/SRAM/Cocotb regression (modeled RC, not Gen1 PIPE).
    command: [python3, tools/regress.py, chip-pcie-host]
    timeout_s: 2400
    tool_versions: [python3, verilator]
# Real Gen1 PIPE + independent host is separately qualified on PR #232.
# This profile reuses the existing mainline RTL regression unchanged.
