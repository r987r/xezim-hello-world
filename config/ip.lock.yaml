schema_version: 1
# Public source revisions are locked. Controllers are integration candidates;
# simulation currently uses the AXI RAM backend, not physical DRAM RTL.
third_party:
  verilog_axi:
    git: https://github.com/alexforencich/verilog-axi.git
    commit: 516bd5dadc3365b7f9e225d2af8fe0b8d804fe53
    license: MIT
    modules:
      - rtl/axi_crossbar.v
      - rtl/axi_crossbar_wr.v
      - rtl/axi_crossbar_rd.v
      - rtl/axi_crossbar_addr.v
      - rtl/axi_register_wr.v
      - rtl/axi_register_rd.v
      - rtl/arbiter.v
      - rtl/priority_encoder.v
      - rtl/axi_ram.v
  picorv32:
    git: https://github.com/YosysHQ/picorv32.git
    commit: ef203c2b0a3fb793280f5114941416c425c5b461
    license: ISC
    modules: [picorv32.v]
  serv:
    git: https://github.com/olofk/serv.git
    commit: f200eb2ed7b69ac1c6b8eddd47654522aeee5ce8
    license: ISC
    modules:
      - rtl/serv_bufreg.v
      - rtl/serv_bufreg2.v
      - rtl/serv_alu.v
      - rtl/serv_csr.v
      - rtl/serv_ctrl.v
      - rtl/serv_decode.v
      - rtl/serv_immdec.v
      - rtl/serv_mem_if.v
      - rtl/serv_rf_if.v
      - rtl/serv_rf_ram_if.v
      - rtl/serv_rf_ram.v
      - rtl/serv_state.v
      - rtl/serv_debug.v
      - rtl/serv_top.v
      - rtl/serv_rf_top.v
      - rtl/serv_aligner.v
      - rtl/serv_compdec.v
  pulp_idma:
    git: https://github.com/pulp-platform/iDMA.git
    commit: a6b1d6657c03998b6df0baf905d7babd006ba614
    license: Solderpad-0.51
    integration: planned
  pulp_axi:
    git: https://github.com/pulp-platform/axi.git
    commit: 70b8e54fd460e3308e58be596ceb3566a6e3576e
    license: Solderpad-0.51
    integration: planned
  floonoc:
