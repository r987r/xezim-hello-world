schema_version: 1
title: SoC verification hub
history_per_workflow: 4
max_archive_mib: 50
max_expanded_mib: 250
workflows:
  - file: dv-soc.yml
    label: Xezim CPU and memory
    artifacts: [heterogeneous-soc-results]
  - file: full-chip.yml
    label: Coordinated chip boot
    artifacts: [full-chip-boot-results]
  - file: floonoc-elab.yml
    label: NoC traffic and compiler checks
    artifacts: [supernoc-real-axi-traffic, xezim-floonoc-compile-probe]
  - file: dma.yml
    label: Real iDMA AXI descriptor chains
    artifacts: [dma-rtl-results]
  - file: pcie0-integrated.yml
    label: PCIe0 host BAR and CPU DMA
    artifacts: [pcie0-dedicated-noc-*, cpu-c-init-run-check-flow-*]
  - file: ethernet-mvp.yml
    label: Ethernet0 GMII, NoC, CPU queue and CQ
    artifacts: [ethernet-chip-data-config-noc-*, ethernet-cpu0-c-queue-cq-*, ethernet-mvp-structural-*, ethernet-axi-mux-sources-*]
  - file: ethernet-standalone.yml
    label: Ethernet0 standalone MAC / GMII
    artifacts: [ethernet0-real-mac-*]
  - file: floogen.yml
    label: Generated topology and contracts
    artifacts: []
