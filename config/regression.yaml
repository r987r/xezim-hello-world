schema_version: 1

# Bender owns source ordering/includes/defines. This small project-specific
# layer selects simulations and checks their results; it is not an IP resolver.
defaults:
  timeout_s: 180

upstream_noc:
  targets: [rtl, cc_no_deprecated]
  # The locked graph also contains uninstantiated SoC blocks. Preserve the
  # existing standalone NoC subset and exclude the unsupported vendor pad.
  exclude_paths:
    - '/(idma|fpnew|fpu_div_sqrt_mvp|register_interface|obi|axi_stream|apb|common_verification)-[^/]+/'
    - '/src/deprecated/pad_functional[.]sv'

tests:
  memory: &memory
    engine: xezim
    sources: memory
    ip: [verilog_axi]
    top: memory_tb
    args: [--max-time, 200us]
    pass: 'PASS: memory_fabric_tb'
  memory-full:
    <<: *memory
    memory_config: config/examples/memory-fabric-connectivity.yaml
  memory-sparse:
    <<: *memory
    memory_config: config/examples/memory-fabric-sparse.yaml
  memory-negative:
    <<: *memory
    args: [--max-time, 200us, '+INJECT_BAD_EXPECTED']
    expect_failure: 'FAIL AXI read:'
  sram: &sram
    engine: xezim
    sources: sram
    top: local_sram_tb
    args: [--max-time, 10us]
    pass: 'PASS: local_sram_tb'
  sram-synthesis:
    <<: *sram
    # Functional read behavior must survive simulation with synthesis guards.
    args: [-D, SYNTHESIS, --max-time, 10us]
  serv:
    engine: xezim
    sources: serv
    ip: [serv]
    top: serv_minimal_tb
    args: [--max-time, 40us]
    pass: 'PASS: serv_minimal_tb'
  boot: &boot
    engine: xezim
    sources: boot
    ip: [picorv32, serv]
    top: boot_tb
    args: [--max-time, 1500us]
    pass: 'PASS: cpu_cold_boot'
  boot-relocated:
    <<: *boot
    # Same cold-boot bench, all movable windows changed together. The ROM
    # reset PC remains zero; bootgen explicitly rejects unsupported policies.
    boot_relocate:
      compute0.sram: '0x12000000'
      compute1.sram: '0x13000000'
      boot.flash: '0x21000000'
      boot.reset_ctrl: '0x41020000'
  cpu-fetch:
    engine: xezim
    sources: cpu
    ip: [picorv32, serv]
    top: heterogeneous_cpu_tb
    args: [--max-time, 50us]
    pass: 'PASS: heterogeneous_cpu_tb'
  smoke:
    engine: xezim
    sources: smoke
    top: hello_world_tb
    args: [--max-time, 1us]
    pass: 'PASS: hello_world_tb'
  noc-verilator:
    engine: verilator-lint
    sources: noc
    timeout_s: 240
  noc-xezim:
    engine: xezim-compile
    sources: noc
    timeout_s: 240
  supernoc: &supernoc
    engine: cocotb-verilator
    sources: noc
    bender_targets: [supernoc]
    top: supernoc_tb
    module: test_supernoc
    seed: 1
    test_dir: dv/supernoc
    build: .tools/supernoc-obj
    timeout_s: 1800
    pass: 'PASS supernoc:'
    report:
      context: 'AXI verification BFMs drive all initiators and model every leaf target. Mapped-route and burst/stall checks are followed by deliberate target-fault tests expecting 24 read/write SLVERR pairs. No CPUs or iDMA engines are instantiated in this BFM scope.'
      axi: {scope: u_noc, clock: clk_i, reset: rst_ni, catalog: gen/supernoc/axi_monitors.json, actors: gen/supernoc/manifest.json, max_events: 500000}
  supernoc-negative:
    <<: *supernoc
    reuse_build: true
    env: {SUPERNOC_NEGATIVE: '1'}
    expect_failure: 'FAIL supernoc injected data mismatch detected'
  dma-rtl:
    engine: cocotb-verilator
    sources: noc
    bender_targets: [dma]
    ip: [pulp_idma]
    top: dma_tb
    module: dv.dma.test_dma
    seed: 1
    test_dir: .
    build: .tools/dma-obj
    timeout_s: 1800
    pass: 'PASS dma-rtl:'
  chip-dma:
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma, chip_dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    top: full_chip_dma_tb
    module: dv.full_chip.test_dma
    seed: 1
    test_dir: .
    build: .tools/chip-dma-obj
    env: {MAKEFLAGS: '-j2'}
    timeout_s: 1800
    pass: 'PASS chipdma: both compute DMA engines'
    report:
      context: 'True iDMA0/iDMA1 instances drive configured local/global FlooNoC data traffic. CPU0 AXI data and configuration managers are temporarily driven by a cocotb host for SRAM descriptor loading and 32-bit DMA doorbells; CPUs stay in reset, so this is NOT a cold-boot pass. Real descriptor fetch, writeback, SSRAM, HBM, DDR and config NoCs are exercised.'
      axi: {scope: dut.u_noc, clock: clk_i, reset: rst_ni, catalog: gen/supernoc/axi_monitors.json, actors: gen/chip/dma_actors.json, max_events: 500000}
  chip-boot: &chip
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot]
    ip: [picorv32, serv, wb2axip, verilog_axi]
    top: full_chip_tb
    module: dv.full_chip.test_boot
    seed: 1
    test_dir: .
    build: .tools/chip-obj
    env: {MAKEFLAGS: '-j2'}
    timeout_s: 1800
    pass: 'PASS fullchip:'
    report:
      context: 'Real PicoRV32/SERV CPUs coordinate boot phases with OKAY responses. Afterwards a verification AXI BFM at the reserved compute0 DMA port tests two 64-KiB SRAM stand-ins, including four intentional out-of-capacity SLVERR transactions. No DMA engine or physical HBM/DDR controller is instantiated.'
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: gen/supernoc/axi_monitors.json, actors: gen/chip/manifest.json, max_events: 500000}
  chip-boot-negative:
    <<: *chip
    reuse_build: true
    args: ['+HOLD_SECONDARY']
    expect_failure: 'FAIL fullchip missing init acknowledgement'
  chip-xezim-compile:
    engine: xezim
    sources: noc
    bender_targets: [chip_boot]
    ip: [picorv32, serv, wb2axip, verilog_axi]
    top: full_chip_tb
    mode: compile
    timeout_s: 240
    pass: 'PASS fullchip:'

suites:
  xezim: [memory, memory-full, memory-sparse, memory-negative, sram, sram-synthesis, serv, boot, boot-relocated]
  noc: [noc-verilator, supernoc, supernoc-negative]
  compatibility: [noc-xezim]
  diagnostics: [cpu-fetch, smoke]
  dma: [dma-rtl]
  chip: [chip-boot, chip-boot-negative, chip-xezim-compile, chip-dma]
  # Every declared test is covered. Structural Xezim probes stay distinct
  # from the Verilator traffic gate; make test requires both toolchains.
  full: [xezim, noc, compatibility, diagnostics, dma, chip]
