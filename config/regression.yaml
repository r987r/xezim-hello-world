schema_version: 1

# Bender owns source ordering/includes/defines. This small project-specific
# layer selects simulations and checks their results; it is not an IP resolver.
defaults:
  timeout_s: 180

upstream_noc:
  targets: [rtl, cc_no_deprecated]
  # The locked graph also contains uninstantiated SoC blocks. Preserve the
  # existing standalone NoC subset and exclude the unsupported vendor pad.
  exclude_paths:
    - '/(idma|fpnew|fpu_div_sqrt_mvp|register_interface|obi|axi_stream|apb|common_verification)-[^/]+/'
    - '/src/deprecated/pad_functional[.]sv'

tests:
  memory: &memory
    logical_test: axi-routing-smoke
    engine: xezim
    sources: memory
    ip: [verilog_axi]
    top: memory_tb
    args: [--max-time, 200us]
    pass: 'PASS: memory_fabric_tb'
  memory-full:
    logical_test: axi-full-matrix
    <<: *memory
    memory_config: config/examples/memory-fabric-connectivity.yaml
  memory-sparse:
    logical_test: axi-sparse-matrix
    <<: *memory
    memory_config: config/examples/memory-fabric-sparse.yaml
  memory-negative:
    logical_test: axi-corruption-rejection
    <<: *memory
    args: [--max-time, 200us, '+INJECT_BAD_EXPECTED']
    expect_failure: 'FAIL AXI read:'
  sram: &sram
    logical_test: sram-port-consistency
    engine: xezim
    sources: sram
    top: local_sram_tb
    args: [--max-time, 10us]
    pass: 'PASS: local_sram_tb'
  sram-synthesis:
    logical_test: sram-port-consistency
    <<: *sram
    # Functional read behavior must survive simulation with synthesis guards.
    args: [-D, SYNTHESIS, --max-time, 10us]
  serv:
    logical_test: cpu-instruction-smoke
    engine: xezim
    sources: serv
    ip: [serv]
    top: serv_minimal_tb
    args: [--max-time, 40us]
    pass: 'PASS: serv_minimal_tb'
  boot: &boot
    logical_test: cpu-cold-boot
    engine: xezim
    sources: boot
    ip: [picorv32, serv]
    top: boot_tb
    args: [--max-time, 1500us]
    pass: 'PASS: cpu_cold_boot'
  boot-relocated:
    logical_test: cpu-cold-boot
    <<: *boot
    # Same cold-boot bench, all movable windows changed together. The ROM
    # reset PC remains zero; bootgen explicitly rejects unsupported policies.
    boot_relocate:
      compute0.sram: '0x15000000'
      compute1.sram: '0x16000000'
      boot.flash: '0x21000000'
      boot.reset_ctrl: '0x41020000'
  cpu-fetch:
    logical_test: cpu-fetch-requests
    engine: xezim
    sources: cpu
    ip: [picorv32, serv]
    top: heterogeneous_cpu_tb
    args: [--max-time, 50us]
    pass: 'PASS: heterogeneous_cpu_tb'
  smoke:
    logical_test: hello-world
    engine: xezim
    sources: smoke
    top: hello_world_tb
    args: [--max-time, 1us]
    pass: 'PASS: hello_world_tb'
  noc-verilator:
    logical_test: noc-rtl-lint
    engine: verilator-lint
    sources: noc
    timeout_s: 240
  noc-xezim:
    logical_test: noc-rtl-compile
    engine: xezim-compile
    sources: noc
    timeout_s: 240
  supernoc: &supernoc
    logical_test: axi-noc-routing
    engine: cocotb-verilator
    sources: noc
    bender_targets: [supernoc]
    top: supernoc_tb
    module: test_supernoc
    seed: 1
    test_dir: dv/supernoc
    build: .tools/supernoc-obj
    timeout_s: 1800
    pass: 'PASS supernoc:'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      fabric_scope: connected_noc
      context: 'AXI verification BFMs drive all initiators and model every leaf target. Mapped-route and burst/stall checks are followed by deliberate target-fault tests expecting 24 read/write SLVERR pairs. No CPUs or iDMA engines are instantiated in this BFM scope.'
      axi: {scope: u_noc, clock: clk_i, reset: rst_ni, catalog: gen/supernoc/axi_monitors.json, actors: gen/supernoc/manifest.json, max_events: 500000}
      memory: {required: true, policies: [strict, fast, hybrid]}
  supernoc-negative:
    logical_test: axi-noc-route-errors
    <<: *supernoc
    reuse_build: true
    env: {SUPERNOC_NEGATIVE: '1'}
    expect_failure: 'FAIL supernoc injected data mismatch detected'
  supernoc-latency:
    opt_in: true
    logical_test: axi-noc-latency-baseline
    engine: cocotb-verilator
    sources: noc
    bender_targets: [supernoc]
    top: supernoc_tb
    module: test_latency
    test_dir: dv/supernoc
    build: .tools/supernoc-obj
    reuse_build: true
    seed: 1
    timeout_s: 1800
    pass: 'PASS fabric-latency:'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      fabric_scope: connected_noc
      context: 'Dedicated unloaded single-outstanding one-beat AXI benchmark; upstream BFMs at declared SuperNoC initiators and passive monitors. No CPUs, PCIe host, Ethernet MAC, real DDR controller or physical PHY.'
      axi: {scope: u_noc, clock: clk_i, reset: rst_ni, catalog: gen/supernoc/axi_monitors.json, actors: gen/supernoc/manifest.json, max_events: 500000, required_complete: true}
      fabric_benchmark: {profile: unloaded, spec: config/fabric_latency.yaml}
  dma-rtl:
    logical_test: dma-descriptor-chain
    engine: cocotb-verilator
    sources: noc
    bender_targets: [dma]
    ip: [pulp_idma]
    top: dma_tb
    module: dv.dma.test_dma
    seed: 1
    test_dir: .
    build: .tools/dma-obj
    timeout_s: 1800
    pass: 'PASS dma-rtl:'
  chip-dma:
    logical_test: dma-fabric-roundtrip
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma, chip_dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    top: full_chip_dma_tb
    module: dv.full_chip.test_dma
    seed: 1
    test_dir: .
    build: .tools/chip-dma-obj
    env: {MAKEFLAGS: '-j2'}
    timeout_s: 900
    pass: 'PASS chipdma: both compute DMA engines'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      context: 'True iDMA0/iDMA1 instances drive configured local/global FlooNoC data traffic. CPU0 AXI BFM (data) and CPU0 AXI BFM (config) temporarily drive their original CPU0 ports for descriptor/payload SRAM loading and DMA doorbells (simulation only, no PCIe); CPUs stay in reset, so this is NOT a cold-boot pass. Real descriptor fetch, writeback, SSRAM, HBM, DDR and config NoCs are exercised.'
      axi: {scope: dut.u_noc, clock: clk_i, reset: rst_ni, catalog: gen/supernoc/axi_monitors.json, actors: gen/chip/dma_actors.json, max_events: 500000}
  chip-cpu-dma:
    logical_test: cpu-dma-roundtrip
    # Same generated soc_top and full_chip_tb checker, but real PicoRV32 runs
    # compiled RV32I C DMA firmware during the existing INIT/RUN/CHECK phases.
    # No AXI BFM assumes the CPU role and SRAM remains cold.
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    firmware_mode: cpu_dma
    top: full_chip_tb
    module: dv.full_chip.test_boot
    seed: 1
    test_dir: .
    build: .tools/chip-cpu-dma-obj
    env: {MAKEFLAGS: '-j2', SOC_CPU_DMA_MODE: '1', SOC_CPU_DMA_PROGRESS: '1'}
    # The exact same real RTL PASS has taken 18m40s to 27m23s on hosted CI.
    # Keep a finite scoped 40-minute bound, with passive progress checkpoints.
    timeout_s: 2400
    pass: 'PASS fullchip:'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      context: 'The real PicoRV32 CPU calls compiled C in the shared cold-boot INIT/RUN/CHECK test, allocates SRAM/DDR/HBM physical regions, and programs the true PULP iDMA through its configuration NoC. No CPU BFM or preloaded SRAM. Check CPU-produced result and read/write AXI handshakes.'
      flow:
        required_steps:
          init: [cpu0.firmware_init]
          run: [cpu0.firmware_run, cpu0.alloc_phys, cpu0.dma_roundtrip, cpu0.verify_memory]
          check: [cpu0.firmware_check]
        required_origins:
          init: {cpu0.firmware_init: rtl_observed}
          run: {cpu0.firmware_run: rtl_observed, cpu0.alloc_phys: rtl_observed, cpu0.dma_roundtrip: rtl_observed, cpu0.verify_memory: rtl_observed}
          check: {cpu0.firmware_check: rtl_observed}
        firmware_mmio:
          monitor: compute0_local_data.cpu
          address: '0x1000045c'
          actors: {'1': cpu0}
          steps: {'101': alloc_phys, '102': dma_roundtrip, '103': verify_memory}
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: gen/supernoc/axi_monitors.json, actors: .tools/regression/chip-cpu-dma/variant/manifest.json, max_events: 500000, required_complete: true}
  chip-cpu-scenario:
    logical_test: dma-sram-ddr-roundtrip
    # Same generated soc_top and full_chip_tb checker, but real PicoRV32 runs
    # compiled RV32I C DMA firmware during the existing INIT/RUN/CHECK phases.
    # No AXI BFM assumes the CPU role and SRAM remains cold.
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    firmware_mode: cpu_dma_scenario
    flow_plan: config/scenarios/cpu-bfm-ddr-roundtrip.json
    top: full_chip_tb
    module: dv.full_chip.test_boot
    seed: 1
    test_dir: .
    build: .tools/chip-cpu-scenario-obj
    env: {MAKEFLAGS: '-j2', SOC_CPU_DMA_MODE: '1'}
    timeout_s: 1800
    pass: 'PASS scenario-cpu:'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      context: 'SCN-2: real PicoRV32 CPU C executes the exact shared source-neutral DDR scenario contract; no BFM on CPU buses or cold SRAM preload. The real PicoRV32 CPU calls compiled C in the shared cold-boot INIT/RUN/CHECK test, allocates SRAM/DDR/HBM physical regions, and programs the true PULP iDMA through its configuration NoC. No CPU BFM or preloaded SRAM. Check CPU-produced result and read/write AXI handshakes.'
      flow:
        required_steps:
          init: [cpu0.firmware_init]
          run: [cpu0.firmware_run, cpu0.alloc_phys, cpu0.dma_roundtrip, cpu0.verify_memory]
          check: [cpu0.firmware_check]
        required_origins:
          init: {cpu0.firmware_init: rtl_observed}
          run: {cpu0.firmware_run: rtl_observed, cpu0.alloc_phys: rtl_observed, cpu0.dma_roundtrip: rtl_observed, cpu0.verify_memory: rtl_observed}
          check: {cpu0.firmware_check: rtl_observed}
        firmware_mmio:
          monitor: compute0_local_data.cpu
          address: '0x1000045c'
          actors: {'1': cpu0}
          steps: {'101': alloc_phys, '102': dma_roundtrip, '103': verify_memory}
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: gen/supernoc/axi_monitors.json, actors: .tools/regression/chip-cpu-scenario/variant/manifest.json, max_events: 500000, required_complete: true}
  chip-dma-scenario:
    logical_test: dma-sram-ddr-roundtrip
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma, chip_dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    top: full_chip_dma_tb
    module: dv.full_chip.test_dma
    seed: 1
    test_dir: .
    firmware_mode: scenario_bfm
    flow_plan: config/scenarios/cpu-bfm-ddr-roundtrip.json
    build: .tools/chip-dma-scenario-obj
    env: {MAKEFLAGS: '-j2'}
    timeout_s: 900
    pass: 'PASS chipdma: scenario BFM real full-NoC DDR roundtrip'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      context: 'SCN-2: reset-isolated CPU0 authorized AXI BFMs execute the same resolved DDR intent as real PicoRV32 C, through actual generated NoCs; confirms readback and DMA passive AXI; existing chip-dma stress stays unchanged. True iDMA0/iDMA1 instances drive configured local/global FlooNoC data traffic. CPU0 AXI BFM (data) and CPU0 AXI BFM (config) temporarily drive their original CPU0 ports for descriptor/payload SRAM loading and DMA doorbells (simulation only, no PCIe); CPUs stay in reset, so this is NOT a cold-boot pass. Real descriptor fetch, writeback, SSRAM, HBM, DDR and config NoCs are exercised.'
      axi: {scope: dut.u_noc, clock: clk_i, reset: rst_ni, catalog: gen/supernoc/axi_monitors.json, actors: gen/chip/dma_actors.json, max_events: 500000}
  chip-ddr4-real:
    logical_test: dma-controller-readback
    opt_in: true
    # Same generated soc_top and full_chip_tb checker, but real PicoRV32 runs
    # compiled RV32I C DMA firmware during the existing INIT/RUN/CHECK phases.
    # No AXI BFM assumes the CPU role and SRAM remains cold.
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    firmware_mode: ddr_cpu_dma
    top: full_chip_tb
    module: dv.full_chip.test_ddr_real
    seed: 1
    test_dir: .
    build: .tools/chip-ddr4-real-obj
    env: {MAKEFLAGS: '-j2', SOC_CPU_DMA_MODE: '1', SOC_DDR_REAL_MODE: '1'}
    timeout_s: 3000
    pass: 'PASS DDR-B full-chip'
    report:
      address_map: {config: .tools/regression/chip-ddr4-real/ddr_noc/soc.yaml, variant: ddr_real, csr_map: .tools/regression/chip-ddr4-real/ddr-native-csr-map.json}
      context: 'Real pinned LiteDRAM with behavioral DDR4 DFI/BankModel behind existing Memory0 crossbar and independent 16KiB Config NoC, real CPU/iDMA and measured AXI/DFI. No physical PHY.'
      flow:
        required_steps:
          init: [cpu0.firmware_init]
          run: [cpu0.firmware_run, cpu0.alloc_phys, cpu0.dma_roundtrip, cpu0.verify_memory]
          check: [cpu0.firmware_check]
        required_origins:
          init: {cpu0.firmware_init: rtl_observed}
          run: {cpu0.firmware_run: rtl_observed, cpu0.alloc_phys: rtl_observed, cpu0.dma_roundtrip: rtl_observed, cpu0.verify_memory: rtl_observed}
          check: {cpu0.firmware_check: rtl_observed}
        firmware_mmio:
          monitor: compute0_local_data.cpu
          address: '0x1000045c'
          actors: {'1': cpu0}
          steps: {'101': alloc_phys, '102': dma_roundtrip, '103': verify_memory}
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: .tools/regression/chip-ddr4-real/ddr_noc/supernoc/axi_monitors.json, actors: .tools/regression/chip-ddr4-real/variant/manifest.json, max_events: 500000, required_complete: true}
      # The 72 read-only wrapper aliases source the same pinned LiteDRAM DFI
      # signals validated by the standalone probe; no physical DDR PHY.
      protocols:
        max_events: 250000
        sources:
          memory0.ddr0.dfi: {protocol: dfi, clock_domain: ddr_source_clk, role: link, implementation: litedram_flat_dfi_probe, modeling: real_controller_rtl_behavioral_phy}
          memory0.ddr0.bankmodel: {protocol: dfi, clock_domain: ddr_source_clk, role: target, implementation: litedram_bankmodel_probe, modeling: behavioral_dram_storage}

  chip-boot: &chip
    logical_test: multicore-cold-boot
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot]
    ip: [picorv32, serv, wb2axip, verilog_axi]
    top: full_chip_tb
    module: dv.full_chip.test_boot
    seed: 1
    test_dir: .
    build: .tools/chip-obj
    env: {MAKEFLAGS: '-j2'}
    timeout_s: 1800
    pass: 'PASS fullchip:'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      context: 'Real PicoRV32/SERV CPUs coordinate boot phases with OKAY responses. Afterwards a verification AXI BFM at the reserved compute0 DMA port tests two 64-KiB SRAM stand-ins, including four intentional out-of-capacity SLVERR transactions. No DMA engine or physical HBM/DDR controller is instantiated.'
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: gen/supernoc/axi_monitors.json, actors: gen/chip/manifest.json, max_events: 500000}
  chip-boot-latency:
    <<: *chip
    opt_in: true
    logical_test: axi-fullchip-latency-baseline
    module: dv.full_chip.test_latency
    reuse_build: true
    pass: 'PASS fabric-latency-chip:'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      fabric_scope: full_chip_boot_bfm
      context: 'Real PicoRV32/SERV cold-boot INIT/RUN/CHECK, then an authorized upstream AXI BFM at reserved unowned compute0 DMA port measures writable SRAM/model-backed paths. This boot-only RTL has NO active iDMA, PCIe requester, Ethernet MAC or physical DDR.'
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: gen/supernoc/axi_monitors.json, actors: gen/chip/manifest.json, max_events: 500000, required_complete: true}
      fabric_benchmark: {profile: unloaded, spec: config/fabric_latency.yaml}
  chip-peakrdl-reset:
    logical_test: reset-ack-register-access
    opt_in: true
    # Real PeakRDL reset/ACK RTL through the generated independent Config NoC.
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot]
    ip: [picorv32, serv, wb2axip, verilog_axi]
    firmware_mode: peakrdl_reset
    top: full_chip_tb
    module: dv.full_chip.test_boot
    seed: 1
    test_dir: .
    build: .tools/chip-peakrdl-reset-obj
    env: {MAKEFLAGS: '-j2'}
    timeout_s: 1800
    pass: 'PASS fullchip:'
    report:
      address_map: {config: config/soc.yaml, variant: cold_boot, csr_map: .tools/regression/chip-peakrdl-reset/csr/csr-map.json}
      context: 'Real PeakRDL reset/ACK over CPU0 Config NoC, PicoRV32/SERV ROM cold boot; DDR/HBM remain behavioral AXI RAM, no PHY.'
      flow:
        required_steps:
          init: [cpu0.init_complete]
          run: [cpu0.run_complete]
          check: [cpu0.check_complete]
        required_origins:
          init: {cpu0.init_complete: checker}
          run: {cpu0.run_complete: checker}
          check: {cpu0.check_complete: checker}
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: gen/supernoc/axi_monitors.json, actors: gen/chip/manifest.json, max_events: 500000, required_complete: true}
  chip-boot-negative:
    logical_test: multicore-boot-timeout
    <<: *chip
    reuse_build: true
    args: ['+HOLD_SECONDARY']
    expect_failure: 'FAIL fullchip missing init acknowledgement'
  chip-xezim-compile:
    logical_test: soc-rtl-compile
    engine: xezim
    sources: noc
    bender_targets: [chip_boot]
    ip: [picorv32, serv, wb2axip, verilog_axi]
    top: full_chip_tb
    mode: compile
    timeout_s: 240
    pass: 'PASS fullchip:'

  chip-ethernet-cpu:
    logical_test: network-queue-control
    # Real PicoRV32 executes compiled C via cold-boot ROM, no AXI CPU BFM.
    # Its on-chip queue CSR/descriptor/CQ accesses share the physical NoCs
    # with the pinned Ethernet RX/TX packet DMA and real GMII frontend.
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    firmware_mode: ethernet_cpu
    top: full_chip_tb
    module: dv.ethernet0.test_cpu_mvp
    seed: 1
    test_dir: .
    build: .tools/chip-ethernet-cpu-obj
    env: {MAKEFLAGS: '-j2', SOC_CPU_DMA_MODE: '1', SOC_ETHERNET_CPU_MODE: '1'}
    timeout_s: 1800
    pass: 'PASS ethernet-cpu: real CPU0 C queue and CQ'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      context: 'Real PicoRV32 cold boot and compiled C configure the physical Ethernet0 queues, memory-resident descriptors and CQ/IRQ through Config/Data NoCs. External GMII source/sink drives only the line. No CPU AXI BFM or memory backdoor.'
      flow:
        required_steps:
          init: [cpu0.firmware_init]
          run: [cpu0.firmware_run, cpu0.eth_queue, cpu0.eth_rx, cpu0.eth_tx]
          check: [cpu0.firmware_check]
        required_origins:
          init: {cpu0.firmware_init: rtl_observed}
          run: {cpu0.firmware_run: rtl_observed, cpu0.eth_queue: rtl_observed, cpu0.eth_rx: rtl_observed, cpu0.eth_tx: rtl_observed}
          check: {cpu0.firmware_check: rtl_observed}
        firmware_mmio:
          monitor: compute0_local_data.cpu
          address: '0x1000045c'
          actors: {'1': cpu0}
          steps: {'201': eth_queue, '202': eth_rx, '203': eth_tx}
      axi: {scope: dut.u_noc, clock: clk, reset: rst_n, catalog: gen/supernoc/axi_monitors.json, actors: .tools/regression/chip-ethernet-cpu/variant/manifest.json, max_events: 500000, required_complete: true}
      protocols:
        max_events: 1000
        sources:
          ethernet0.gmii_rx: {protocol: ethernet, clock_domain: gmii_rx_clock, role: stimulus, implementation: cocotbext_eth, modeling: vip_injected_to_rtl_mac}
          ethernet0.gmii_tx: {protocol: ethernet, clock_domain: gmii_tx_clock, role: target, implementation: cocotbext_eth, modeling: rtl_output_observed_by_vip}
  chip-ethernet:
    logical_test: network-frame-transfer
    # Real 1-GMII-MAC RX/TX queue/DMA/CQ via six-source PULP AXI mux,
    # Ethernet0 local/global data and separate configuration FlooNoCs.
    # CPU0 AXI BFMs temporarily own CPU ports while CPUs are held reset.
    # Does not claim actual CPU0 firmware or physical DDR/PCIe PHY.
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma, chip_dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    firmware_mode: ethernet_mvp
    top: full_chip_dma_tb
    module: dv.ethernet0.test_chip_mvp
    seed: 1
    test_dir: .
    build: .tools/chip-ethernet-obj
    env: {MAKEFLAGS: '-j2', SOC_ETHERNET_MODE: '1'}
    timeout_s: 1800
    pass: 'PASS chip-ethernet:'
    report:
      address_map: {config: config/soc.yaml, variant: architecture}
      context: 'Real GMII through actual Ethernet0 local/global Data NoC to SRAM and modeled DDR, with AXI CQ completions and Config NoC BFM queue CSR. Real PULP AXI mux; CPU0 C firmware and PCIe host remain separate gates.'
      axi: {scope: dut.u_noc, clock: clk_i, reset: rst_ni, catalog: gen/supernoc/axi_monitors.json, actors: .tools/regression/chip-ethernet/variant/manifest.json, max_events: 500000, required_complete: true}
      protocols:
        max_events: 1000
        sources:
          ethernet0.gmii_rx: {protocol: ethernet, clock_domain: gmii_rx_clock, role: stimulus, implementation: cocotbext_eth, modeling: vip_injected_to_rtl_mac}
          ethernet0.gmii_tx: {protocol: ethernet, clock_domain: gmii_tx_clock, role: target, implementation: cocotbext_eth, modeling: rtl_output_observed_by_vip}
  chip-pcie-host:
    logical_test: host-memory-exchange
    # The same generated soc_top/full_chip_tb and firmware phase protocol.
    # Only this run owns the PCIe0 host initiator and external RC model.
    engine: cocotb-verilator
    sources: noc
    bender_targets: [chip_boot, dma]
    ip: [picorv32, serv, wb2axip, verilog_axi, pulp_idma]
    firmware_mode: pcie_dma_host
    top: full_chip_tb
    module: dv.pcie0.test_full_chip_host
    seed: 1
    test_dir: .
