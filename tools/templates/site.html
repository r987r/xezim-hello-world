<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · SoC verification</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121e31;--line:#2b3c54;--fg:#e9eff8;--muted:#a9b9d0;--accent:#80d4ff;--green:#7ee2b1;--red:#ff939b;--purple:#d1afff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,sans-serif}a{color:var(--accent);text-underline-offset:3px}header,main,footer{max-width:1440px;margin:auto;padding:24px 4vw}header{border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:750;color:var(--fg);text-decoration:none}nav{display:flex;gap:12px 26px;flex-wrap:wrap;margin-top:14px}nav a{font-size:14px;text-decoration:none}main{min-height:70vh;padding-top:34px}footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}h1{font-size:clamp(30px,4vw,49px);line-height:1.15;margin:12px 0 20px;letter-spacing:-.035em}h2{font-size:24px;line-height:1.3;margin:32px 0 16px}h3{font-size:18px}.eyebrow{font:12px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}.lede{max-width:900px;font-size:18px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.stat{font-size:32px;font-weight:700;line-height:1.3}.muted,small{color:var(--muted)}.notice{border-left:3px solid var(--accent);background:var(--panel);padding:14px 20px;margin:24px 0}.good{color:var(--green)}.bad{color:var(--red)}.intent{color:var(--purple)}.pill{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:30px;padding:3px 9px;white-space:nowrap}.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;margin:16px 0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--line)}th{background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap}td code,th code{white-space:nowrap}tr:last-child td{border-bottom:0}input,select,button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font:inherit}button{cursor:pointer}label{font-size:13px;color:var(--muted)}.filters{display:flex;align-items:end;gap:14px;flex-wrap:wrap}.filters label{display:flex;flex-direction:column;gap:4px}.topology{display:block;width:100%;background:#fff;border-radius:12px;margin:20px 0}.prose{max-width:1140px;overflow-wrap:break-word}.prose h1{font-size:36px}.prose img{max-width:100%;height:auto;background:#fff}.prose table{display:block;overflow:auto}.prose ul,.prose ol{padding-left:25px}pre{background:#07101d;border:1px solid var(--line);padding:18px;border-radius:8px;overflow:auto;font-size:13px}code{font: .88em ui-monospace,SFMono-Regular,monospace}p code,li code,td code{color:#c7deff}.list{padding:0;list-style:none}.list li{padding:12px 0;border-bottom:1px solid var(--line)}.source{font-size:12px;overflow-wrap:anywhere}.empty{padding:24px;color:var(--muted)}.actions{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}@media(max-width:650px){header,main,footer{padding-left:20px;padding-right:20px}.grid{grid-template-columns:1fr 1fr}.card{padding:14px}td,th{padding:10px}h1{font-size:32px}}
</style></head><body><header><a class="brand" href="__HOME__">SoC / verification hub</a><nav aria-label="Main navigation">__NAV__</nav></header><main>__CONTENT__</main><footer>Source snapshot <a href="__REPO__">__SOURCE__</a>. Test evidence carries its own tested SHA and workflow run. Generated architecture and measured simulation traffic are identified separately.</footer></body></html>
