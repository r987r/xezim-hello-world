name: xezim_pcie0_local_config
description: 'Xezim pcie0_local_config: independent config FlooNoC from SoC config'
network_type: axi
routing:
  route_algo: XY
  use_id_table: true
protocols:
- name: axi_in
  type: narrow
  protocol: AXI4
  data_width: 32
  addr_width: 32
  id_width: 1
  user_width: 1
  type_prefix: null
- name: axi_out
  type: narrow
  protocol: AXI4
  data_width: 32
  addr_width: 32
  id_width: 1
  user_width: 1
  type_prefix: null
endpoints:
- name: management
  mgr_port_protocol:
  - axi_in
- name: global_in
  mgr_port_protocol:
  - axi_in
- name: controller_regs
  sbr_port_protocol:
  - axi_out
  addr_range:
    base: 1074003968
    size: 65536
- name: global_out
  sbr_port_protocol:
  - axi_out
  addr_range:
  - base: 1073741824
    size: 65536
  - base: 1073872896
    size: 4096
  - base: 1073807360
    size: 65536
  - base: 1073938432
    size: 4096
routers:
- name: router
  array:
  - 2
  - 2
  degree: 5
connections:
- src: management
  dst: router
  dst_idx:
  - 0
  - 0
  dst_dir: Eject
- src: global_in
  dst: router
  dst_idx:
  - 1
  - 0
  dst_dir: Eject
- src: controller_regs
  dst: router
  dst_idx:
  - 0
  - 1
  dst_dir: Eject
- src: global_out
  dst: router
  dst_idx:
  - 1
  - 1
  dst_dir: Eject
