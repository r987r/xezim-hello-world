name: xezim_global_data
description: 'Xezim global_data: independent data FlooNoC from SoC config'
network_type: axi
routing:
  route_algo: XY
  use_id_table: true
protocols:
- name: axi_in
  type: narrow
  protocol: AXI4
  data_width: 64
  addr_width: 64
  id_width: 5
  user_width: 1
  type_prefix: null
- name: axi_out
  type: narrow
  protocol: AXI4
  data_width: 64
  addr_width: 64
  id_width: 4
  user_width: 1
  type_prefix: null
endpoints:
- name: compute0
  mgr_port_protocol:
  - axi_in
- name: compute1
  mgr_port_protocol:
  - axi_in
- name: compute0_sram
  sbr_port_protocol:
  - axi_out
  addr_range:
    base: 268435456
    size: 1048576
- name: compute1_sram
  sbr_port_protocol:
  - axi_out
  addr_range:
    base: 285212672
    size: 1048576
- name: memory_ingress0
  sbr_port_protocol:
  - axi_out
  addr_range:
    base: 4294967296
    size: 1073741824
- name: memory_ingress1
  sbr_port_protocol:
  - axi_out
  addr_range:
    base: 5368709120
    size: 1073741824
routers:
- name: router
  array:
  - 3
  - 2
  degree: 5
connections:
- src: compute0
  dst: router
  dst_idx:
  - 0
  - 0
  dst_dir: Eject
- src: compute1
  dst: router
  dst_idx:
  - 1
  - 0
  dst_dir: Eject
- src: compute0_sram
  dst: router
  dst_idx:
  - 2
  - 0
  dst_dir: Eject
- src: compute1_sram
  dst: router
  dst_idx:
  - 0
  - 1
  dst_dir: Eject
- src: memory_ingress0
  dst: router
  dst_idx:
  - 1
  - 1
  dst_dir: Eject
- src: memory_ingress1
  dst: router
  dst_idx:
  - 2
  - 1
  dst_dir: Eject
