<polygon points="392.0,423.0 400.0,417.1 401.2,427.0" fill="#B66B22"/>
<rect x="80.0" y="642.0" width="535.0" height="112.0" rx="12.0" fill="#E6F6EC" stroke="#19734B" stroke-width="1"/>
<text x="96.0" y="654.0" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">CPU0 executes SRAM0 program</text>
<text x="96.0" y="686.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">Writes 0x55 to 0x10000100</text>
<rect x="765.0" y="642.0" width="535.0" height="112.0" rx="12.0" fill="#E6F6EC" stroke="#19734B" stroke-width="1"/>
<text x="781.0" y="654.0" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">CPU1 executes SRAM1 program</text>
<text x="781.0" y="686.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">Writes 0x66 to 0x11000100</text>
<polyline points="393.0,535.0 393.0,642.0" fill="none" stroke="#19734B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="393.0,642.0 388.0,633.3 398.0,633.3" fill="#19734B"/>
<polyline points="1038.0,535.0 1038.0,642.0" fill="none" stroke="#19734B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1038.0,642.0 1033.0,633.3 1043.0,633.3" fill="#19734B"/>
<rect x="80.0" y="812.0" width="1220.0" height="104.0" rx="12.0" fill="#F3EDFD" stroke="#7047B5" stroke-width="1"/>
<text x="96.0" y="824.0" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">Boot control CSR + scoreboard</text>
<text x="96.0" y="856.0" font-size="17" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">CPU0 store 0x40020000=1 releases CPU1. Test requires flash reads, SRAM writes, both signatures.</text>
<polyline points="1038.0,754.0 1038.0,812.0" fill="none" stroke="#7047B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1038.0,812.0 1033.0,803.3 1043.0,803.3" fill="#7047B5"/>
<text x="91.0" y="931.0" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">Future: replace memory-mapped flash model with QSPI; integrate real local/global NoC and DMA.</text>
</svg>
