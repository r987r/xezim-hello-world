<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img" aria-label="Generated two-dimensional SoC diagram">
<rect width="1440" height="990" fill="#F7F9FC"/>
<text x="64.0" y="28.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#255BAE" text-anchor="start" dominant-baseline="hanging">BOOT  -  EXECUTABLE SCOPE</text>
<text x="64.0" y="55.0" font-size="32" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">CPU0 Boot ROM loads two SRAMs</text>
<text x="64.0" y="101.0" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">Boot: rom_copy / mapped_flash / mmio | no dedicated boot CPU | no global NoC</text>
<polyline points="64.0,137.0 1376.0,137.0" fill="none" stroke="#D8E1EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="80.0" y="186.0" width="380.0" height="105.0" rx="12.0" fill="#F3EDFD" stroke="#7047B5" stroke-width="1"/>
<text x="96.0" y="198.0" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">Power-on reset</text>
<text x="96.0" y="230.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">compute0 active / compute1 held in reset</text>
<rect x="530.0" y="186.0" width="380.0" height="105.0" rx="12.0" fill="#E9F1FD" stroke="#255BAE" stroke-width="1"/>
<text x="546.0" y="198.0" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">PicoRV32 executes Boot ROM</text>
<text x="546.0" y="230.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">0x00000000 | real instruction fetch</text>
<polyline points="460.0,238.0 530.0,238.0" fill="none" stroke="#255BAE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="530.0,238.0 521.3,243.0 521.3,233.0" fill="#255BAE"/>
<rect x="955.0" y="186.0" width="395.0" height="105.0" rx="12.0" fill="#FFF2E4" stroke="#B66B22" stroke-width="1"/>
<text x="971.0" y="198.0" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">Mapped flash model (not QSPI)</text>
<text x="971.0" y="230.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">0x20000000 | read-only, hex initialized</text>
<polyline points="910.0,238.0 955.0,238.0" fill="none" stroke="#255BAE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="955.0,238.0 946.3,243.0 946.3,233.0" fill="#255BAE"/>
<rect x="80.0" y="346.0" width="1270.0" height="224.0" rx="20.0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="2"/>
<text x="109.0" y="359.0" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">boot_local_decode RTL routes CPU0 AXI-Lite reads/writes to dual-port SRAM RTL</text>
<rect x="125.0" y="423.0" width="535.0" height="112.0" rx="12.0" fill="#FFF2E4" stroke="#B66B22" stroke-width="1"/>
<text x="141.0" y="435.0" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">SRAM0: CPU0 firmware</text>
<text x="141.0" y="467.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">0x10000000 | uninitialized SRAM RTL, then 4 stores</text>
<rect x="770.0" y="423.0" width="535.0" height="112.0" rx="12.0" fill="#FFF2E4" stroke="#B66B22" stroke-width="1"/>
<text x="786.0" y="435.0" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#17253B" text-anchor="start" dominant-baseline="hanging">SRAM1: SERV firmware</text>
<text x="786.0" y="467.0" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#53657C" text-anchor="start" dominant-baseline="hanging">0x11000000 | uninitialized SRAM RTL, then 4 stores</text>
<polyline points="1130.0,291.0 1130.0,423.0" fill="none" stroke="#B66B22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1130.0,423.0 1125.0,414.3 1135.0,414.3" fill="#B66B22"/>
